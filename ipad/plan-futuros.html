<title>Plan de Futuros</title>
<style>
.pf { --bg: #f1f4f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --faint: #94a3b8; --line: #e2e8f0; --soft: #f8fafc;
      --green: #16a34a; --green-bg: #dcfce7; --blue: #2563eb; --blue-bg: #dbeafe; --yellow: #ca8a04; --yellow-bg: #fef9c3;
      --red: #dc2626; --red-bg: #fee2e2; --navy: #0f172a; --navy2: #1e293b; --gold: #eab308;
      font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; color: var(--ink); background: var(--bg);
      min-height: 100%; -webkit-text-size-adjust: 100%; }
.pf * { box-sizing: border-box; }
.pf button, .pf input, .pf select, .pf textarea { font: inherit; color: inherit; }
.pf .bar { position: sticky; top: 0; z-index: 5; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px;
           padding: 14px 22px; padding-top: max(14px, env(safe-area-inset-top)); }
.pf .bar h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.pf .tag { background: #22c55e; color: #052e16; font-size: 11px; font-weight: 800; letter-spacing: .12em; padding: 3px 9px; border-radius: 999px; }
.pf .bar .sub { margin-left: auto; color: #94a3b8; font-size: 13px; }
.pf #pf-back { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 10px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
.pf #pf-back[hidden] { display: none; }
.pf main { max-width: 1500px; margin: 0 auto; padding: 26px 22px 60px; }
.pf .head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.pf .head h2 { margin: 0; font-size: 38px; letter-spacing: -.03em; }
.pf .head p { margin: 6px 0 0; color: var(--muted); }
.pf .head .acts { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.pf .btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
.pf .btn.green { background: #22c55e; border-color: #22c55e; color: #fff; }
.pf .btn.dark { background: var(--navy2); border-color: var(--navy2); color: #fff; }
.pf .btn.small { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.pf .tabs { display: flex; gap: 4px; background: #e2e8f0; padding: 5px; border-radius: 14px; margin: 26px 0 22px; overflow-x: auto; }
.pf .tabs button { border: 0; background: transparent; padding: 10px 18px; border-radius: 10px; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
.pf .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.pf .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; }
.pf .card h3 { margin: 0; font-size: 18px; }
.pf .card .hint { color: var(--faint); font-size: 14px; margin: 3px 0 0; }
.pf .cardhead { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
.pf .cardhead .btn { margin-left: auto; }
.pf .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
.pf .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 18px; }
@media (max-width: 900px) { .pf .grid2 { grid-template-columns: 1fr; } .pf .grid4 { grid-template-columns: 1fr 1fr; } .pf .bar .sub { display: none; } }
.pf .kpi .lab { font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.pf .kpi .val { font-size: 34px; font-weight: 800; letter-spacing: -.03em; margin-top: 18px; }
.pf .banner { border-radius: 14px; padding: 14px 18px; font-weight: 600; border: 2px solid; }
.pf .banner.ok { background: #f0fdf4; border-color: #86efac; color: var(--green); }
.pf .banner.bad { background: #fef2f2; border-color: #fca5a5; color: var(--red); }
.pf .pos { color: var(--green); } .pf .neg { color: var(--red); } .pf .blue { color: var(--blue); } .pf .dim { color: var(--faint); }
.pf .tablewrap { overflow-x: auto; }
.pf table { width: 100%; border-collapse: collapse; font-size: 15px; }
.pf th { text-align: left; font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.pf td { padding: 14px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pf td b { font-weight: 700; }
.pf .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.pf .pill.tipo { background: var(--blue-bg); color: var(--blue); }
.pf .st-ACTIVA { background: var(--green-bg); color: #15803d; } .pf .st-EXAM { background: var(--yellow-bg); color: #a16207; }
.pf .st-STANDBY { background: #f1f5f9; color: #475569; } .pf .st-PENDIENTE { background: #f8fafc; color: #94a3b8; } .pf .st-PERDIDA { background: var(--red-bg); color: var(--red); }
.pf .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.pf .dir { background: var(--red-bg); color: var(--red); } .pf .dir.LONG { background: var(--green-bg); color: var(--green); }
.pf .res-TP { background: var(--green-bg); color: var(--green); } .pf .res-SL { background: var(--red-bg); color: var(--red); } .pf .res-BE { background: #f1f5f9; color: #475569; }
.pf .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.pf .filters select, .pf .filters input { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; }
.pf .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.pf .chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 18px; font-weight: 600; letter-spacing: .04em; color: var(--muted); cursor: pointer; }
.pf .chips button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.pf .pager { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--muted); }
.pf .pager .btn { margin-left: auto; } .pf .pager .btn + .btn { margin-left: 0; }
.pf .gcard { border: 1px solid var(--line); background: var(--soft); border-radius: 14px; padding: 14px 18px; margin-top: 10px; }
.pf .gcard .top { display: flex; justify-content: space-between; font-weight: 700; font-size: 17px; }
.pf .gcard .meta { color: var(--muted); font-size: 14px; margin-top: 6px; display: flex; gap: 18px; flex-wrap: wrap; }
.pf .gcard .meta b { color: var(--ink); }
.pf .rule { display: grid; grid-template-columns: 300px 330px 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 13px 18px; margin-top: 10px; }
@media (max-width: 900px) { .pf .rule { grid-template-columns: 1fr; } }
.pf .rule b { font-weight: 700; } .pf .rule .v { color: var(--green); font-weight: 700; } .pf .rule .n { color: var(--faint); font-size: 14px; }
.pf .sec { letter-spacing: .12em; font-weight: 800; font-size: 15px; margin: 26px 0 6px; padding-bottom: 10px; border-bottom: 2px solid var(--line); }
.pf .check { display: flex; gap: 12px; align-items: center; padding: 9px 0; color: var(--faint); cursor: pointer; }
.pf .check input { width: 20px; height: 20px; accent-color: #22c55e; }
.pf .check input:checked + span { color: var(--ink); text-decoration: line-through; text-decoration-color: #86efac; }
.pf textarea { width: 100%; min-height: 140px; border-radius: 12px; background: var(--navy2); color: #e2e8f0; border: 0; padding: 14px; }
.pf .dark select { background: var(--navy2); color: #fff; border: 0; border-radius: 10px; padding: 9px 12px; width: 100%; }
.pf .risk { background: var(--navy); color: #e2e8f0; border-radius: 18px; overflow: hidden; }
.pf .risk th { color: #cbd5e1; border-color: #334155; background: var(--navy); }
.pf .risk td { background: #fff; color: var(--ink); }
.pf .risk select, .pf .risk input[type=number] { background: var(--navy2); color: #fff; border: 1px solid #334155; border-radius: 9px; padding: 7px 10px; width: 110px; }
.pf .risk .mult { color: var(--gold); font-weight: 700; width: 90px; }
.pf .risk input.loss { color: #f87171; font-weight: 700; } .pf .risk input.gain { color: #4ade80; font-weight: 700; }
.pf .tog { width: 46px; height: 26px; border-radius: 999px; border: 0; background: #334155; cursor: pointer; vertical-align: middle; margin-right: 8px; }
.pf .tog[aria-pressed="true"] { background: #22c55e; }
.pf .riskinfo { background: var(--navy); color: #cbd5e1; border-radius: 14px; padding: 16px 20px; line-height: 1.6; }
.pf .riskinfo b { color: var(--gold); }
.pf .ficha { margin-top: 16px; }
.pf .ficha td b.v { font-size: 15px; }
.pf .estado { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #dcfce7; color: #15803d; }
.pf .estado.dll80 { background: #fef3c7; color: #b45309; } .pf .estado.dll100 { background: #fee2e2; color: #b91c1c; } .pf .estado.dpt100 { background: #dbeafe; color: #1d4ed8; }
.pf .banner.warn { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
.pf .bulk { background: var(--navy); color: #e2e8f0; border-radius: 18px; padding: 20px 22px; margin: 16px 0; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.pf .bulk label { display: grid; gap: 6px; font-size: 14px; color: #cbd5e1; }
.pf .bulk input, .pf .bulk select { background: var(--navy2); color: #fff; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; }
.pf .bulk h4 { margin: 0; width: 100%; color: var(--gold); }
.pf .cal { display: grid; grid-template-columns: repeat(7, 1fr) 140px; border-top: 1px solid var(--line); }
.pf .cal .h { text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .12em; font-weight: 700; padding: 12px 0; }
.pf .cal .d { min-height: 96px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 10px; font-size: 14px; color: var(--muted); }
.pf .cal .d.out { background: var(--soft); }
.pf .cal .d.today { outline: 2px solid #22c55e; outline-offset: -2px; }
.pf .cal .d .p { margin-top: 18px; font-weight: 800; font-size: 16px; text-align: center; }
.pf .cal .d.win { background: #f0fdf4; } .pf .cal .d.loss { background: #fef2f2; }
.pf .cal .w { background: var(--soft); border-bottom: 1px solid var(--line); text-align: right; padding: 22px 14px; font-size: 14px; color: var(--muted); }
.pf .cal .w b { display: block; color: var(--ink); font-size: 16px; }
.pf .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pf .seg button { border: 0; background: #fff; padding: 9px 16px; cursor: pointer; }
.pf .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.pf .modal { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.pf .modal[hidden] { display: none; }
.pf .modal form { background: #fff; border-radius: 18px; padding: 22px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.pf .modal form h3 { grid-column: 1 / -1; margin: 0; }
.pf .modal label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
.pf .modal label.full { grid-column: 1 / -1; }
.pf .modal input, .pf .modal select { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); background: #fff; }
.pf .modal .row { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; }
.pf .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 30; }
.pf .toast[hidden] { display: none; }
.pf .ico { border: 0; background: transparent; cursor: pointer; font-size: 16px; padding: 4px; }
.pf .empty { color: var(--faint); padding: 20px 0; text-align: center; }
.pf .live { font-size: 11px; font-weight: 800; color: #15803d; background: var(--green-bg); border-radius: 6px; padding: 1px 6px; margin-left: 6px; letter-spacing: .06em; }
.pf svg text { font-family: inherit; }
</style>
<div class="pf" id="pf">
  <div class="bar">
    <button id="pf-back" type="button" hidden>← Galaxia</button>
    <h1>📈 Plan de Futuros <span class="tag">TRACKER</span></h1>
    <span class="sub">TopStep · Lucid · Tradeify &nbsp;|&nbsp; Sistema de Grupos + Suplentes</span>
  </div>
  <main>
    <div class="head">
      <div><h2>Control Maestro</h2><p>Gestiona grupos, cuentas, operaciones y reglas del sistema.</p></div>
      <div class="acts"><button class="btn" id="pf-export" type="button">📤 Exportar datos</button><button class="btn" id="pf-import" type="button">📥 Importar datos</button></div>
    </div>
    <nav class="tabs" id="pf-tabs" role="tablist"></nav>
    <section id="pf-view"></section>
  </main>
  <div class="modal" id="pf-modal" hidden><form id="pf-form" autocomplete="off"></form></div>
  <div class="toast" id="pf-toast" hidden></div>
  <input type="file" id="pf-file" accept="application/json,.json" hidden>
</div>
<script>
(() => {
"use strict";
// Plan de Futuros · Tracker. Data lives in the artifact's database under fm/plan/*; accounts linked to
// Topstep (topstepId) take their balance from fm/topstep, which Jarvis's scheduled reads keep fresh.
const ROOT = window.__PLAN_ROOT || document;
const $ = (s) => ROOT.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => new Intl.NumberFormat("es-ES", { style: "currency", currency: "USD", minimumFractionDigits: 2 }).format(Number(n) || 0);
const signed = (n) => (n > 0 ? "+" : "") + money(n);
const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "pos");
const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const MESES_L = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const fecha = (iso) => { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${+d} ${MESES[+m - 1]} ${y}`; };
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const monday = (s) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const ESTADOS = ["ACTIVA", "EXAM", "STANDBY", "PENDIENTE", "PERDIDA"];
const ESTADO_DOT = { ACTIVA: "#16a34a", EXAM: "#eab308", STANDBY: "#cbd5e1", PENDIENTE: "#e2e8f0", PERDIDA: "#dc2626" };
const ESTADO_COLOR = { ACTIVA: "#22c55e", EXAM: "#eab308", STANDBY: "#94a3b8", PENDIENTE: "#cbd5e1", PERDIDA: "#ef4444" };
const GRUPO_ESTADOS = { MAESTRA: "👑 MAESTRA", ACTIVO: "🔄 ACTIVO", PAUSADO: "⏸️ PAUSADO", RESERVA: "⚪ RESERVA" };
const ICONO = (g, i) => (g.estado === "MAESTRA" ? "🥇" : i === 1 ? "🥈" : "📊");
const ACCIONES = ["Liquidar", "Cerrar y bloquear", "Solo alertar"];
const TABS = [["dashboard", "Dashboard"], ["grupos", "Grupos"], ["cuentas", "Cuentas"], ["operaciones", "Operaciones"], ["semanas", "Semanas"],
              ["reglas", "Reglas"], ["backtest", "📒 Backtesting"], ["domingo", "📋 Domingo"], ["riesgo", "⚙️ Riesgo"], ["calendario", "📅 Calendario"]];

const S = { tab: "dashboard", grupos: new Map(), cuentas: new Map(), ops: new Map(), semanas: new Map(), revisiones: new Map(), topstep: null,
            ready: false, db: null, page: { cuentas: 0, ops: 0 }, f: { chip: "todos", cg: "", ct: "", ce: "", og: "", oc: "", or: "", oq: "", rq: "", rg: "" },
            cal: { y: new Date().getFullYear(), m: new Date().getMonth(), modo: "pct", g: "", c: "", anual: false }, risk: {}, sel: new Set(), rev: null };
try { S.tab = localStorage.getItem("pf-tab") || "dashboard"; } catch {}
if (!TABS.some(([k]) => k === S.tab)) S.tab = "dashboard";

const list = (m) => [...m.entries()].map(([id, v]) => ({ id, ...v }));
const grupos = () => list(S.grupos).sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99));
const cuentas = () => list(S.cuentas).sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99) || String(a.codigo).localeCompare(b.codigo));
// Operations: the ones Joel logs plus, for accounts linked to Topstep, every trade Jarvis reads from Topstep.
const tsOps = () => cuentas().flatMap((c) => (ts(c)?.trades || []).map((t) => ({ ...t, id: "ts-" + t.id, cuenta: c.id, auto: true, creado: t.cierra })));
const ops = () => [...list(S.ops), ...tsOps()].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || (b.creado || "").localeCompare(a.creado || ""));
const gName = (id) => S.grupos.get(id)?.nombre || "—";
const cCode = (id) => S.cuentas.get(id)?.codigo || "—";

// Topstep: a linked account's P&L is its live balance minus the starting balance.
const ts = (c) => (c.topstepId && S.topstep?.cuentas?.[c.topstepId]?.balance != null ? S.topstep.cuentas[c.topstepId] : null);
const pnl = (c) => { const t = ts(c); return t ? Math.round((t.balance - (Number(c.balanceIni) || 0)) * 100) / 100 : Number(c.pnl) || 0; };
// Day P&L per account: Topstep's days for linked accounts, otherwise the logged operations.
function dayMap() {
  const m = {};
  for (const c of cuentas()) {
    const t = ts(c), days = {};
    if (t && t.dias) Object.assign(days, t.dias);
    else for (const o of ops()) if (o.cuenta === c.id && o.fecha) days[o.fecha] = (days[o.fecha] || 0) + (Number(o.pnl) || 0);
    m[c.id] = days;
  }
  return m;
}
const capital = (cs) => cs.reduce((a, c) => a + (Number(c.balanceIni) || 0), 0);
// Today's trading day as Topstep counts it (a session that opens at 17:00 Chicago belongs to the next date).
const tradingDay = (t) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(new Date(t).getTime() + 7 * 3600 * 1000));
// Watching the daily limits: today's P&L of each live account linked to Topstep against its loss limit and profit target.
const NIVEL = { dll80: "⚠️ Cerca del límite", dll100: "🛑 Límite pasado", dpt100: "🎯 Objetivo alcanzado" };
function vigil() {
  const hoy = tradingDay(Date.now());
  return cuentas().filter((c) => ts(c) && (c.estado === "ACTIVA" || c.estado === "EXAM")).map((c) => {
    const r = riskOf(c), v = Math.round(((ts(c).dias || {})[hoy] || 0) * 100) / 100;
    const dll = r.dllOn ? Number(r.dll) || null : null, dpt = r.dptOn ? Number(r.dpt) || null : null;
    return { c, r, hoy: v, dll, dpt, nivel: dll && v <= -dll ? "dll100" : dll && v <= -0.8 * dll ? "dll80" : dpt && v >= dpt ? "dpt100" : null };
  });
}
function grupoStats(g, days = dayMap()) {
  const cs = cuentas().filter((c) => c.grupo === g.id);
  const lunes = monday(iso(new Date()));
  let semana = 0;
  for (const c of cs) for (const [d, v] of Object.entries(days[c.id] || {})) if (d >= lunes && d < addDays(lunes, 7)) semana += v;
  const total = cs.reduce((a, c) => a + pnl(c), 0), cap = capital(cs), slTot = cs.reduce((a, c) => a + Math.abs(Number(c.sl) || 0), 0);
  return { cs, activas: cs.filter((c) => c.estado === "ACTIVA" || c.estado === "EXAM").length, verdes: cs.filter((c) => pnl(c) > 0).length,
           rojas: cs.filter((c) => pnl(c) < 0).length, semana, total, cap, semanaPct: cap ? semana / cap : 0,
           dd: slTot && total < 0 ? Math.round((-total / slTot) * 100) : 0, examen: cs.filter((c) => c.estado === "EXAM").length };
}
function pausa() {
  const days = dayMap();
  const malos = grupos().filter((g) => g.estado === "ACTIVO" || g.estado === "MAESTRA").map((g) => [g, grupoStats(g, days)]).filter(([, s]) => s.semanaPct <= -0.05);
  return malos.length ? { ok: false, txt: "⛔ PAUSAR COPIADOR — " + malos.map(([g, s]) => `${g.nombre} ${(s.semanaPct * 100).toFixed(1)}%`).join(", ") + " esta semana (umbral -5%)" }
                      : { ok: true, txt: "✅ OPERAR NORMAL — Ningún grupo ha superado el umbral de pausa del -5%" };
}

// ── charts (plain SVG) ─────────────────────────────────────────
function bars(series, labels, { h = 230, money: m = true } = {}) {
  const all = series.flatMap((s) => s.values), max = Math.max(1, ...all.map((v) => Math.abs(v))), neg = all.some((v) => v < 0);
  const W = 640, pad = 54, top = 30, bot = 30, ch = h - top - bot, zero = neg ? top + ch / 2 : top + ch;
  const scale = (v) => (neg ? (v / max) * (ch / 2) : (v / max) * ch);
  const gw = (W - pad - 10) / Math.max(1, labels.length), bw = Math.min(46, (gw - 16) / series.length);

// ── groups chosen like the TopStep Squad, and Topstep accounts that register themselves ──
// Squad's rule, on the groups that rotate (ACTIVO; MAESTRA and RESERVA keep theirs): funded accounts are spread so no group
// holds them all, then each exam goes to the group with fewest live accounts, mixing advanced exams with fragile ones.
const vivaC = (c) => c.estado === "ACTIVA" || c.estado === "EXAM";
const progreso = (c) => { const tp = Number(c.tp) || 0; return c.tipo === "Fondeada" || !tp ? 0 : Math.max(0, pnl(c) / tp); };

const rotan = () => grupos().filter((g) => g.estado === "ACTIVO");
const menor = (ids, key) => ids.slice().sort((a, b) => { const A = key(a), B = key(b); for (let i = 0; i < A.length; i++) if (A[i] !== B[i]) return A[i] - B[i]; return 0; })[0];
function grupoPara(c) {
  const ids = rotan().map((g) => g.id); if (!ids.length) return "";
  const vivas = cuentas().filter((x) => vivaC(x) && x.id !== c.id);
  return menor(ids, (g) => { const cs = vivas.filter((x) => x.grupo === g); return [c.tipo === "Fondeada" ? cs.filter((x) => x.tipo === "Fondeada").length : 0, cs.length, cs.reduce((a, x) => a + progreso(x), 0)]; });
}
function reparto() {
  const ids = rotan().map((g) => g.id); if (!ids.length) return [];
  const mov = cuentas().filter((c) => vivaC(c) && ids.includes(c.grupo));
  const cnt = {}, fond = {}, prog = {}, out = new Map(); ids.forEach((g) => { cnt[g] = fond[g] = prog[g] = 0; });
  mov.filter((c) => c.tipo === "Fondeada").sort((x, y) => colchon(y) - colchon(x)).forEach((c) => { const g = menor(ids, (g) => [fond[g], cnt[g]]); out.set(c.id, g); fond[g]++; cnt[g]++; });
  mov.filter((c) => c.tipo !== "Fondeada").sort((x, y) => progreso(y) - progreso(x)).forEach((c) => { const g = menor(ids, (g) => [cnt[g], prog[g]]); out.set(c.id, g); cnt[g]++; prog[g] += progreso(c); });
  return [...out].filter(([id, g]) => S.cuentas.get(id)?.grupo !== g).map(([id, g]) => ({ id, de: S.cuentas.get(id)?.grupo, a: g }));
}
// Topstep: every active account the hourly read finds that isn't in the plan yet. Practice accounts never count.
const tsTam = (n) => { const m = String(n || "").match(/^(\d+)K/i); return m ? Number(m[1]) * 1000 : 50000; };

const multTxt = (g) => { const r = Number(String(g?.ratio || "1:1").split(":")[0]); return (Number.isFinite(r) && r > 0 ? r : 1) + "x"; };

  const ligadas = new Set(cuentas().map((c) => String(c.topstepId || "")).filter(Boolean)), ign = S.autoreg?.ignoradas || [];
  return Object.entries(S.topstep?.cuentas || {}).filter(([id, a]) => a && a.nombre && tsTipo(a.nombre) && !ligadas.has(String(id)) && !ign.includes(id)).map(([id, a]) => ({ id, ...a }));
}
async function registrarTs(lista) {
  let n = Math.max(0, ...cuentas().map((c) => Number((String(c.codigo).match(/^TS-(\d+)$/i) || [])[1]) || 0));
  const hechas = [];
  for (const a of lista) {
    const tam = tsTam(a.nombre), tipo = tsTipo(a.nombre), r = REGLAS_TS[tam] || { tp: tam * 0.06, sl: -tam * 0.04 };
    const c = { codigo: "TS-" + ++n, empresa: "TopStep", tipo, estado: tipo === "Fondeada" ? "ACTIVA" : "EXAM", balanceIni: tam, pnl: 0, tp: r.tp, sl: r.sl,
                topstepId: String(a.id), orden: 100 + n, origen: "Topstep (automática)", registrada: iso(new Date()) };
    c.grupo = grupoPara(c);

    const par = cuentas().find((x) => x.grupo === c.grupo && Number(x.balanceIni) === tam && x.dll != null && vivaC(x));
    const m = multTxt(S.grupos.get(c.grupo)), k = (parseFloat(m) || 1) * tam / 50000;

                         : { mult: m, dllOn: true, dll: Math.round(1000 * k), dllAccion: "Liquidar", dptOn: true, dpt: Math.round(1500 * k), dptAccion: "Liquidar" });
    await S.db.doc("fm/plan").collection("cuentas").doc("ts-auto-" + a.id).set(c);

    await S.db.doc("fm/main").collection("cuentas").doc("ts-auto-" + a.id).set({ alias: c.codigo, firma: "Topstep", plataforma: "TopstepX", tamano: tam, fase: tipo === "Fondeada" ? "fondeada" : "evaluacion",
      estado: "activa", balanceInicial: tam, ddTipo: "eod", ddMax: Math.abs(r.sl), ddTope: "", perdidaDiaria: 0, objetivo: tipo === "Fondeada" ? 0 : r.tp, consistencia: 50,
      topstepId: String(a.id), dias: [1, 2, 3, 4, 5], creado: new Date().toISOString(), origen: "Topstep (automática)" });

// Accounts bought from now on register themselves; the ones that were already unlinked when this started wait in Cuentas for a tap.
async function autoRegistro() {

// ── "Hoy operas": the two-bullet plan for exams and strong day + minimum days for funded accounts ──
// Exams: bullet 1 risks b1r to make b1t; if it wins, bullet 2 goes in the SAME account (b2r to make b2t), never past the
// consistency cap of the day. If bullet 1 loses, that account stops for the day and the next one (or next group) takes over.
// A winning or flat day keeps the same account in focus; a losing day moves the focus on.
// ESTRATEGIA_DEF, estrategiaDe() and motorReglas() come from topstep-sync.mjs (the hourly watch), copied in by build-space.mjs.
/*@motor-reglas@*/
const est = () => estrategiaDe(S.estrategia);
// The engine on today's accounts: the same warnings the hourly watch sends to his phone, live while the app is open.
function motor() {
  const dia = tradingDay(Date.now()), dm = dayMap();
  return motorReglas({ estrategia: est(), hoy: dia, cuentas: cuentas().map((c) => ({ codigo: c.codigo, tipo: c.tipo, estado: c.estado, tp: c.tp, sl: c.sl, orden: c.orden,
    pnl: pnl(c), dias: dm[c.id] || {}, tradesHoy: tradesDia(c, dia) })), ahora: new Date().toISOString() });
}
const tradesDia = (c, d) => [...(ts(c)?.trades || []).filter((x) => x.fecha === d).map((x) => ({ pnl: Number(x.pnl) || 0, at: x.cierra || "" })),
  ...list(S.ops).filter((o) => o.cuenta === c.id && o.fecha === d).map((o) => ({ pnl: Number(o.pnl) || 0, at: o.creado || "" }))].sort((a, b) => (a.at < b.at ? -1 : 1));
function unidades() {
  const E = est(), gs = rotan(), ex = cuentas().filter((c) => vivaC(c) && c.tipo !== "Fondeada" && gs.some((g) => g.id === c.grupo));
  if (E.modo === "grupo") return gs.map((g) => ({ id: g.id, nombre: g.nombre, cuentas: ex.filter((c) => c.grupo === g.id) })).filter((u) => u.cuentas.length);
  return ex.map((c) => ({ id: c.id, nombre: c.codigo, cuentas: [c] }));
}
function balas(c, d) {

    const x = motor().examenes.find((y) => y.cuenta === c.codigo), tot = tradesDia(c, d).reduce((a, y) => a + y.pnl, 0), n = tradesDia(c, d).length;
    return { estado: !n ? "londres" : tot < 0 ? "stop" : "fin", tot, txt: x ? x.txt : "" };
  }
  const E = est(), tr = tradesDia(c, d), tot = tr.reduce((a, x) => a + x.pnl, 0), obj = Number(c.tp) || 3000, falta = Math.max(0, obj - pnl(c));
  const tope = obj * E.consistencia / 100, colchon = pnl(c) - (Number(c.sl) || -2000);
  if (falta <= 0) return { estado: "hecho", txt: "🏁 Objetivo alcanzado: revisa días mínimos y consistencia antes de pedir la fondeada." };
  if (!tr.length) { const r = Math.min(E.b1r, colchon), g = Math.min(E.b1t, falta, tope);
    return { estado: "bala1", r, g, txt: "Bala 1: arriesga " + money(r) + " para ganar " + money(g) + "." + (colchon <= E.b1r ? " ⚠️ Solo le queda " + money(colchon) + " de margen: es su última bala." : "") }; }
  if (tr.length === 1 && tr[0].pnl > 0) { const g = Math.min(E.b2t, falta - tot > 0 ? falta - tot : 0, Math.max(0, tope - tot)), r = Math.min(E.b2r, colchon);

                 : { estado: "fin", tot, txt: "✅ Día hecho (" + signed(tot) + "): llegas al tope del día por la consistencia. Mañana sigue esta cuenta." }; }
  if (tr[0].pnl <= 0 && tr.length === 1) return { estado: "stop", tot, txt: "🛑 Stop en la bala 1 (" + signed(tot) + "): esta cuenta para hoy. La siguiente bala va a la siguiente cuenta." };
  return { estado: "fin", tot, txt: (tot > 0 ? "✅ Día hecho (" : tot < 0 ? "🛑 Día cerrado (" : "Día cerrado (") + signed(tot) + "). " + (tot < 0 ? "Mañana toca otra cuenta." : "Mañana sigue esta cuenta.") };
}
function hoyOperas() {
  const E = est(), dia = tradingDay(Date.now()), us = unidades(), R = S.rotacion || {};

  else lineas.push("Opera " + (E.modo === "grupo" ? foco.nombre + " (" + foco.cuentas.map((c) => c.codigo).join(", ") + ", copiadas desde la MASTER)" : foco.nombre) + ". " + e.txt);
  return { dia, foco, e, unidades: us.map((u) => ({ u, e: estadoU(u) })), lineas, fondeadas: fondeadasHoy() };
}
const fondeadasHoy = () => motor().fondeadas;
// The focus moves on by itself: a new trading day after a losing day, or a stop today, writes the next unit.
async function avanzarFoco() {
  if (!S.db || !S.ready || !S.rotacionLista || S.rotBusy) return;
  const h = hoyOperas(); if (!h.foco) return;
  const R = S.rotacion || {}; if (R.foco === h.foco.id) return;
  S.rotBusy = true;
  try { await S.db.doc("fm/plan").collection("config").doc("rotacion").set({ foco: h.foco.id, dia: h.dia, historial: [...(R.historial || []).slice(-40), { dia: h.dia, de: R.foco || null, a: h.foco.id }] }); }
  catch {} finally { S.rotBusy = false; }
}
function hoyHtml() {

      <div class="seg" style="margin-top:6px"><button type="button" data-ver="exModo:londres" aria-pressed="${E.exModo === "londres"}">Londres + Nueva York</button><button type="button" data-ver="exModo:balas" aria-pressed="${E.exModo !== "londres"}">2 balas</button></div></div>
    <div class="seg"><button type="button" data-modo="individual" aria-pressed="${E.modo === "individual"}">Cuenta a cuenta</button><button type="button" data-modo="grupo" aria-pressed="${E.modo === "grupo"}">Por grupos (copiadas)</button></div></div>
    ${h.lineas.map((l) => `<div class="banner ok" style="margin-bottom:8px">${esc(l)}</div>`).join("")}
    ${h.unidades.length ? `<div class="tablewrap"><table><thead><tr><th>${E.modo === "grupo" ? "GRUPO" : "CUENTA"}</th><th>HOY</th></tr></thead><tbody>${h.unidades.map(({ u, e }) => `<tr><td><b>${esc(u.nombre)}</b>${u.id === h.foco.id ? ' <span class="live">EN FOCO</span>' : ""}<br><small class="dim">${esc(u.cuentas.map((c) => c.codigo + " " + signed(pnl(c))).join(" · "))}</small></td><td style="white-space:normal">${esc(e.txt)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${h.fondeadas.length ? `<div class="sec" style="margin-top:16px">FONDEADAS · DÍA FUERTE + DÍAS MÍNIMOS</div><p class="hint">${esc(motor().resumen)}</p>${h.fondeadas.map((f) => `<div class="rule"><b>${esc(f.cuenta)}</b><span class="v" style="grid-column:span 2">${esc(f.txt)}</span></div>`).join("")}` : ""}
    <details style="margin-top:12px"><summary class="hint" style="cursor:pointer">Ajustar la estrategia</summary><div class="filters" style="margin-top:10px">
      ${[...(E.exModo === "londres" ? [["lonR", "Londres · riesgo"], ["lonT", "Londres · objetivo"], ["lonMax", "Londres · buscar con trailing"]]

        .map(([k, l]) => `<label style="display:grid;gap:4px;font-size:12px;color:var(--muted)">${l}<input type="number" data-est="${k}" value="${E[k]}" style="width:120px"></label>`).join("")}</div></details></div>`;
}

// ── render & events ────────────────────────────────────────────
function render() {
  $("#pf-tabs").innerHTML = TABS.map(([k, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${n}</button>`).join("");
  $("#pf-view").innerHTML = !S.ready ? '<p class="empty">Cargando tu plan…</p>' : V[S.tab]();
}
const root = $("#pf");
root.addEventListener("click", async (e) => {
  const t = e.target.closest("button, [data-cal]"); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; try { localStorage.setItem("pf-tab", S.tab); } catch {} render(); return; }
  if (d.chip) { S.f.chip = d.chip; render(); return; }
  if (d.new) return openForm(d.new);
  if (d.edit) return openForm(d.edit, d.id);
  if (d.cancel != null) { $("#pf-modal").hidden = true; return; }
  if (d.del != null) return delForm(t);
  if (d.page) { const [k, n] = d.page.split(":"); S.page[k] = Math.max(0, S.page[k] + Number(n)); render(); return; }
  if (d.tog) { const [id, k] = d.tog.split("."); const r = riskOf(S.cuentas.get(id) ? { id, ...S.cuentas.get(id) } : {}); S.risk[id] = { ...(S.risk[id] || {}), [k]: !r[k] }; render(); guardarRiesgo(); return; }
  if (d.cal) {
    const C = S.cal, [k, v] = d.cal.split(":");
    if (k === "modo") C.modo = v; else if (k === "anual") C.anual = !C.anual; else if (k === "mes") { C.m = Number(v); C.anual = false; }
    else if (k === "prev") { if (C.anual) C.y--; else if (--C.m < 0) { C.m = 11; C.y--; } } else if (k === "next") { if (C.anual) C.y++; else if (++C.m > 11) { C.m = 0; C.y++; } }
    render(); return;
  }
  if (d.act === "guardar-riesgo") {
    if (!S.db) return toast("Abre el Plan dentro de Claude para guardar.");
    const ids = Object.keys(S.risk); for (const id of ids) await S.db.doc("fm/plan").collection("cuentas").doc(id).update(S.risk[id]);
    S.risk = {}; toast(ids.length ? `Riesgo guardado en ${ids.length} cuenta(s).` : "No había cambios."); return;
  }
  if (d.act === "reset-riesgo") { S.risk = {}; render(); toast("Cambios descartados."); return; }
  if (d.act === "bulk") {
    const m = $("#b-mult").value, dll = $("#b-dll").value, dpt = $("#b-dpt").value;
    for (const id of S.sel) { const p = { ...(S.risk[id] || {}) }; if (m) p.mult = m; if (dll !== "") { p.dll = Number(dll); p.dllAccion = $("#b-dlla").value; } if (dpt !== "") { p.dpt = Number(dpt); p.dptAccion = $("#b-dpta").value; } S.risk[id] = p; }
    render(); guardarRiesgo(0); return;
  }
  if (d.act === "guardar-rev") {
    if (!S.db) return toast("Abre el Plan dentro de Claude para guardar.");
    const r = revActual(); await S.db.doc("fm/plan").collection("revisiones").doc(r.id).set({ checks: r.checks, estados: r.estados, notas: r.notas, guardada: new Date().toISOString() });
    toast("Revisión guardada."); return;
  }
  if (d.modo) { await guardarEst({ modo: d.modo }); return; }
  if (d.ver) { const [k, v] = d.ver.split(":"); await guardarEst({ [k]: v }); return; }
  if (d.act === "repartir") {
    if (!S.db) return toast("Abre el Plan dentro de Claude para guardar.");
    if (!dosToques(t, "¿Aplicar? Toca otra vez")) return;
    const cambios = reparto(); for (const x of cambios) await S.db.doc("fm/plan").collection("cuentas").doc(x.id).update({ grupo: x.a });
    toast(cambios.length ? "Grupos repartidos: " + cambios.map((x) => cCode(x.id) + " → " + gName(x.a)).join(", ") + "." : "Ya estaban repartidos."); return;
  }
  if (d.reg) { if (!S.db) return; const a = sinRegistrar().find((x) => x.id === d.reg); if (!a) return; const [c] = await registrarTs([a]); toast("Registrada " + c.codigo + " en " + gName(c.grupo) + "."); return; }
  if (d.ign) { if (!S.db) return; await S.db.doc("fm/plan").collection("config").doc("autoregistro").update({ ignoradas: [...(S.autoreg?.ignoradas || []), d.ign] }); toast("Ignorada."); return; }
  if (d.act === "nueva-rev") { S.rev = { id: domingoHoy(), checks: {}, estados: {}, notas: "" }; render(); return; }
});
async function guardarEst(p) {
  S.estrategia = { ...est(), ...p, v: 3 }; render();
  if (S.db) try { await S.db.doc("fm/plan").collection("config").doc("estrategia").set(S.estrategia); toast("Estrategia guardada."); } catch (err) { toast("No se ha guardado: " + (err.message || "error")); }
}
root.addEventListener("change", (e) => {
  const t = e.target, d = t.dataset;
  if (d.est) { const v = Number(t.value); if (Number.isFinite(v) && v >= 0) guardarEst({ [d.est]: v }); return; }
  if (d.f) { S.f[d.f] = t.value; S.page.cuentas = S.page.ops = 0; render(); return; }
  if (d.calf) { S.cal[d.calf] = t.value; render(); return; }
  if (d.r) { const [id, k] = d.r.split("."); S.risk[id] = { ...(S.risk[id] || {}), [k]: t.type === "number" ? Number(t.value) : t.value }; guardarRiesgo(0); return; }
  if (d.sel) { t.checked ? S.sel.add(d.sel) : S.sel.delete(d.sel); render(); return; }
  if (d.selall != null) { const q = S.f.rq.trim().toLowerCase(); for (const c of cuentas().filter((c) => (!S.f.rg || c.grupo === S.f.rg) && (!q || c.codigo.toLowerCase().includes(q)))) t.checked ? S.sel.add(c.id) : S.sel.delete(c.id); render(); return; }
  if (d.check) { revActual().checks[d.check] = t.checked; return; }
  if (d.estado) { revActual().estados[d.estado] = t.value; return; }
  if (d.rev != null) { const r = S.revisiones.get(t.value); S.rev = { id: t.value, checks: { ...(r?.checks || {}) }, estados: { ...(r?.estados || {}) }, notas: r?.notas || "" }; render(); return; }
});
// A risk value typed in the table saves itself a moment later, even if the field is never left (iPad keeps the keyboard up).
root.addEventListener("input", (e) => { const r = e.target.dataset.r; if (r && e.target.type === "number" && e.target.value !== "") { const [id, k] = r.split("."); S.risk[id] = { ...(S.risk[id] || {}), [k]: Number(e.target.value) }; guardarRiesgo(); } });
root.addEventListener("input", (e) => { if (e.target.dataset.notas != null) revActual().notas = e.target.value; if (e.target.dataset.f === "oq" || e.target.dataset.f === "rq") { S.f[e.target.dataset.f] = e.target.value; const pos = e.target.selectionStart; render(); const el = $(`[data-f="${e.target.dataset.f}"]`); el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } });
$("#pf-form").addEventListener("submit", saveForm);
$("#pf-modal").addEventListener("click", (e) => { if (e.target.id === "pf-modal") $("#pf-modal").hidden = true; });

// Export / import: one JSON file with the whole plan.
$("#pf-export").addEventListener("click", async () => {
  const data = { app: "plan-de-futuros", version: 1, exportado: new Date().toISOString(),
    grupos: list(S.grupos), cuentas: list(S.cuentas), operaciones: list(S.ops), semanas: list(S.semanas), revisiones: list(S.revisiones) };
  const text = JSON.stringify(data, null, 1), filename = `plan-de-futuros-${iso(new Date())}.json`;
  try { const dl = await window.claude?.use?.("downloads"); if (dl) { await dl.save({ filename, data: text }); return; } } catch (err) { if (err && err.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = filename; a.click();

$("#pf-import").addEventListener("click", () => $("#pf-file").click());
$("#pf-file").addEventListener("change", async () => {

// What Jarvis reads when Joel asks about his plan.
function contexto() {
  const days = dayMap(), p = pausa(), os = ops();
  return {
    estadoDelSistema: p.txt,
    grupos: grupos().map((g) => { const s = grupoStats(g, days); return { grupo: g.nombre, empresa: g.empresa, ratio: g.ratio || null, estado: g.estado, suplente: g.suplente ? cCode(g.suplente) : null,
      cuentas: s.cs.length, verdes: s.verdes, rojas: s.rojas, pnlSemana: Math.round(s.semana * 100) / 100, pnlTotal: Math.round(s.total * 100) / 100, pctDrawdown: s.dd }; }),
    cuentas: cuentas().map((c) => { const v = pnl(c), r = riskOf(c); return { cuenta: c.codigo, grupo: gName(c.grupo), empresa: c.empresa, tipo: c.tipo, estado: c.estado,
      balanceInicial: c.balanceIni, pnlActual: v, pctPnl: c.balanceIni ? Math.round((v / c.balanceIni) * 10000) / 100 : 0, tpObjetivo: c.tp, slLimite: c.sl,
      faltaParaTP: Math.round(((Number(c.tp) || 0) - v) * 100) / 100, margenHastaSL: Math.round((v - (Number(c.sl) || 0)) * 100) / 100, datosDeTopstep: !!ts(c),
      riesgo: { multiplicador: r.mult, limitePerdidaDiaria: r.dllOn ? r.dll : null, objetivoGananciaDiaria: r.dptOn ? r.dpt : null } }; }),
    operacionesRecientes: os.slice(0, 15).map((o) => ({ origen: o.auto ? "Topstep (automática)" : "apuntada a mano", fecha: o.fecha, cuenta: cCode(o.cuenta), instrumento: o.instr, direccion: o.dir, contratos: o.contratos, pnl: o.pnl, resultado: o.resultado })),
    semanas: semanasAll(days).sort((a, b) => (b.inicio || "").localeCompare(a.inicio || "")).slice(0, 12).map((w) => { const st = semanaStats(w, days);
      return { semana: w.semana, inicio: w.inicio, grupo: gName(w.grupo), pnl: Math.round(st.pnl * 100) / 100, pctCapital: Math.round(st.pct * 100) / 100, operaciones: st.ops, automatica: !!w.auto }; }),
    hoyOperas: (() => { const h = hoyOperas(); return { queOperarHoy: h.lineas, modo: est().modo === "grupo" ? "por grupos copiados desde la MASTER" : "cuenta a cuenta",
      estrategia: est(), cuentas: (h.unidades || []).map(({ u, e }) => ({ unidad: u.nombre, enFoco: h.foco && u.id === h.foco.id, hoy: e.txt })), fondeadas: h.fondeadas, fondeadasResumen: motor().resumen }; })(),
    avisosDeSusReglas: motor().avisos.map((a) => a.txt),
    vigilanciaHoy: vigil().map((x) => ({ cuenta: x.c.codigo, pnlHoy: x.hoy, limitePerdidaDiaria: x.dll, objetivoDiario: x.dpt, estado: x.nivel ? NIVEL[x.nivel] : "dentro de sus límites" })),
    fichaTopstepX: vigil().map((x) => ({ cuenta: x.c.codigo, idTopstep: x.c.topstepId, limitePerdidaDiaria: x.dll, accionLimite: x.r.dllAccion, objetivoGananciaDiaria: x.dpt, accionObjetivo: x.r.dptAccion, multiplicadorCopiador: x.r.mult })),
    cuentasTopstepSinRegistrar: sinRegistrar().map((a) => a.nombre),
    repartoAutomaticoPendiente: reparto().map((x) => cCode(x.id) + ": " + gName(x.de) + " → " + gName(x.a)),
    winRate: os.length ? Math.round((os.filter((o) => o.resultado === "TP").length / os.length) * 1000) / 10 + "%" : null,
    backtesting: btContexto(),
    reglas: reglasElegidas().map(([t, rs]) => t + ": " + rs.map(([a, b]) => `${a} = ${b}`).join("; ")),
  };
}
// open(tab): Jarvis opens the Plan on a tab when Joel asks for it by voice.
window.PLAN = { contexto, render, btApuntar: (texto, imagen) => btApuntar(texto, imagen), btClase: (tipo) => btLeccion(tipo), avisos: () => (S.ready ? motor().avisos : []), open: (tab) => { if (typeof tab === "string" && TABS.some(([k]) => k === tab)) { S.tab = tab; try { localStorage.setItem("pf-tab", tab); } catch {} } render(); } };

// The 📒 Backtesting tab lives in ipad/backtest.js; build-space.mjs copies it in here.
/*@backtest@*/

// ── data ───────────────────────────────────────────────────────
(async () => {
  render();
  const db = window.claude?.use ? await window.claude.use("db") : null;
  S.db = db;
  if (!db) { S.ready = true; render(); return; }
  const plan = db.doc("fm/plan"), pend = new Set(["grupos", "cuentas", "operaciones", "semanas", "revisiones", "topstep"]);
  const editando = () => { const a = ROOT.activeElement; return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.closest("#pf-view"); };
  const done = (k) => { pend.delete(k); if (!pend.size && !S.ready) { S.ready = true; } if (k === "topstep" || k === "cuentas") setTimeout(autoRegistro, 500); if (editando()) { S.renderLuego = true; return; } render(); };

  const sub = (col, map) => plan.collection(col).onSnapshot((snap) => { map.clear(); for (const d of snap.docs) map.set(d.id, d.data()); if (col === "revisiones" && S.rev && !S.revisiones.has(S.rev.id)) {} done(col); }, () => done(col));
  btSub(plan);
  sub("grupos", S.grupos); sub("cuentas", S.cuentas); sub("operaciones", S.ops); sub("semanas", S.semanas); sub("revisiones", S.revisiones);
  db.doc("fm/topstep").onSnapshot((snap) => { S.topstep = snap.exists ? snap.data() : null; done("topstep"); }, () => done("topstep"));
  plan.collection("config").doc("estrategia").onSnapshot((snap) => { S.estrategia = snap.exists ? snap.data() : null; render(); }, () => {});
  plan.collection("config").doc("rotacion").onSnapshot((snap) => { S.rotacion = snap.exists ? snap.data() : null; S.rotacionLista = true; setTimeout(avanzarFoco, 300); render(); }, () => {});
  setInterval(avanzarFoco, 20000);
  plan.collection("config").doc("autoregistro").onSnapshot((snap) => { S.autoreg = { exists: snap.exists, ...(snap.exists ? snap.data() : {}) }; autoRegistro(); render(); }, () => {});
  setTimeout(() => { if (!S.ready) { S.ready = true; render(); } }, 8000);
  setInterval(autoRegistro, 15000);
})();
})();
