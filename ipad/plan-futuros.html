<title>Plan de Futuros</title>
<style>
.pf { --bg: #f1f4f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --faint: #94a3b8; --line: #e2e8f0; --soft: #f8fafc;
      --green: #16a34a; --green-bg: #dcfce7; --blue: #2563eb; --blue-bg: #dbeafe; --yellow: #ca8a04; --yellow-bg: #fef9c3;
      --red: #dc2626; --red-bg: #fee2e2; --navy: #0f172a; --navy2: #1e293b; --gold: #eab308;
      font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; color: var(--ink); background: var(--bg);
      min-height: 100%; -webkit-text-size-adjust: 100%; }
.pf * { box-sizing: border-box; }
.pf button, .pf input, .pf select, .pf textarea { font: inherit; color: inherit; }
.pf .bar { position: sticky; top: 0; z-index: 5; background: var(--navy); color: #fff; display: flex; align-items: center; gap: 12px;
           padding: 14px 22px; padding-top: max(14px, env(safe-area-inset-top)); }
.pf .bar h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.pf .tag { background: #22c55e; color: #052e16; font-size: 11px; font-weight: 800; letter-spacing: .12em; padding: 3px 9px; border-radius: 999px; }
.pf .bar .sub { margin-left: auto; color: #94a3b8; font-size: 13px; }
.pf #pf-back { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 10px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
.pf #pf-back[hidden] { display: none; }
.pf main { max-width: 1500px; margin: 0 auto; padding: 26px 22px 60px; }
.pf .head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.pf .head h2 { margin: 0; font-size: 38px; letter-spacing: -.03em; }
.pf .head p { margin: 6px 0 0; color: var(--muted); }
.pf .head .acts { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.pf .btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
.pf .btn.green { background: #22c55e; border-color: #22c55e; color: #fff; }
.pf .btn.dark { background: var(--navy2); border-color: var(--navy2); color: #fff; }
.pf .btn.small { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.pf .tabs { display: flex; gap: 4px; background: #e2e8f0; padding: 5px; border-radius: 14px; margin: 26px 0 22px; overflow-x: auto; }
.pf .tabs button { border: 0; background: transparent; padding: 10px 18px; border-radius: 10px; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
.pf .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.pf .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; }
.pf .card h3 { margin: 0; font-size: 18px; }

.pf .cardhead { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
.pf .cardhead .btn { margin-left: auto; }
.pf .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
.pf .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 18px; }
@media (max-width: 900px) { .pf .grid2 { grid-template-columns: 1fr; } .pf .grid4 { grid-template-columns: 1fr 1fr; } .pf .bar .sub { display: none; } }
.pf .kpi .lab { font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.pf .kpi .val { font-size: 34px; font-weight: 800; letter-spacing: -.03em; margin-top: 18px; }
.pf .banner { border-radius: 14px; padding: 14px 18px; font-weight: 600; border: 2px solid; }
.pf .banner.ok { background: #f0fdf4; border-color: #86efac; color: var(--green); }
.pf .banner.bad { background: #fef2f2; border-color: #fca5a5; color: var(--red); }
.pf .pos { color: var(--green); } .pf .neg { color: var(--red); } .pf .blue { color: var(--blue); } .pf .dim { color: var(--faint); }
.pf .tablewrap { overflow-x: auto; }
.pf table { width: 100%; border-collapse: collapse; font-size: 15px; }
.pf th { text-align: left; font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.pf td { padding: 14px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pf td b { font-weight: 700; }
.pf .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.pf .pill.tipo { background: var(--blue-bg); color: var(--blue); }
.pf .st-ACTIVA { background: var(--green-bg); color: #15803d; } .pf .st-EXAM { background: var(--yellow-bg); color: #a16207; }
.pf .st-STANDBY { background: #f1f5f9; color: #475569; } .pf .st-PENDIENTE { background: #f8fafc; color: #94a3b8; } .pf .st-PERDIDA { background: var(--red-bg); color: var(--red); }
.pf .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.pf .dir { background: var(--red-bg); color: var(--red); } .pf .dir.LONG { background: var(--green-bg); color: var(--green); }
.pf .res-TP { background: var(--green-bg); color: var(--green); } .pf .res-SL { background: var(--red-bg); color: var(--red); } .pf .res-BE { background: #f1f5f9; color: #475569; }
.pf .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.pf .filters select, .pf .filters input { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; }
.pf .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.pf .chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 18px; font-weight: 600; letter-spacing: .04em; color: var(--muted); cursor: pointer; }
.pf .chips button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.pf .pager { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--muted); }
.pf .pager .btn { margin-left: auto; } .pf .pager .btn + .btn { margin-left: 0; }
.pf .gcard { border: 1px solid var(--line); background: var(--soft); border-radius: 14px; padding: 14px 18px; margin-top: 10px; }
.pf .gcard .top { display: flex; justify-content: space-between; font-weight: 700; font-size: 17px; }
.pf .gcard .meta { color: var(--muted); font-size: 14px; margin-top: 6px; display: flex; gap: 18px; flex-wrap: wrap; }
.pf .gcard .meta b { color: var(--ink); }
.pf .rule { display: grid; grid-template-columns: 300px 330px 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--soft); border-radius: 12px; padding: 13px 18px; margin-top: 10px; }
@media (max-width: 900px) { .pf .rule { grid-template-columns: 1fr; } }
.pf .rule b { font-weight: 700; } .pf .rule .v { color: var(--green); font-weight: 700; } .pf .rule .n { color: var(--faint); font-size: 14px; }
.pf .sec { letter-spacing: .12em; font-weight: 800; font-size: 15px; margin: 26px 0 6px; padding-bottom: 10px; border-bottom: 2px solid var(--line); }
.pf .check { display: flex; gap: 12px; align-items: center; padding: 9px 0; color: var(--faint); cursor: pointer; }
.pf .check input { width: 20px; height: 20px; accent-color: #22c55e; }
.pf .check input:checked + span { color: var(--ink); text-decoration: line-through; text-decoration-color: #86efac; }
.pf textarea { width: 100%; min-height: 140px; border-radius: 12px; background: var(--navy2); color: #e2e8f0; border: 0; padding: 14px; }
.pf .dark select { background: var(--navy2); color: #fff; border: 0; border-radius: 10px; padding: 9px 12px; width: 100%; }
.pf .risk { background: var(--navy); color: #e2e8f0; border-radius: 18px; overflow: hidden; }
.pf .risk th { color: #cbd5e1; border-color: #334155; background: var(--navy); }
.pf .risk td { background: #fff; color: var(--ink); }
.pf .risk select, .pf .risk input[type=number] { background: var(--navy2); color: #fff; border: 1px solid #334155; border-radius: 9px; padding: 7px 10px; width: 110px; }
.pf .risk .mult { color: var(--gold); font-weight: 700; width: 90px; }
.pf .risk input.loss { color: #f87171; font-weight: 700; } .pf .risk input.gain { color: #4ade80; font-weight: 700; }
.pf .tog { width: 46px; height: 26px; border-radius: 999px; border: 0; background: #334155; cursor: pointer; vertical-align: middle; margin-right: 8px; }
.pf .tog[aria-pressed="true"] { background: #22c55e; }
.pf .riskinfo { background: var(--navy); color: #cbd5e1; border-radius: 14px; padding: 16px 20px; line-height: 1.6; }
.pf .riskinfo b { color: var(--gold); }
.pf .ficha { margin-top: 16px; }
.pf .ficha td b.v { font-size: 15px; }
.pf .estado { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #dcfce7; color: #15803d; }
.pf .estado.dll80 { background: #fef3c7; color: #b45309; } .pf .estado.dll100 { background: #fee2e2; color: #b91c1c; } .pf .estado.dpt100 { background: #dbeafe; color: #1d4ed8; }
.pf .banner.warn { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
.pf .bulk { background: var(--navy); color: #e2e8f0; border-radius: 18px; padding: 20px 22px; margin: 16px 0; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.pf .bulk label { display: grid; gap: 6px; font-size: 14px; color: #cbd5e1; }
.pf .bulk input, .pf .bulk select { background: var(--navy2); color: #fff; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; }
.pf .bulk h4 { margin: 0; width: 100%; color: var(--gold); }
.pf .cal { display: grid; grid-template-columns: repeat(7, 1fr) 140px; border-top: 1px solid var(--line); }
.pf .cal .h { text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .12em; font-weight: 700; padding: 12px 0; }
.pf .cal .d { min-height: 96px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 10px; font-size: 14px; color: var(--muted); }
.pf .cal .d.out { background: var(--soft); }
.pf .cal .d.today { outline: 2px solid #22c55e; outline-offset: -2px; }
.pf .cal .d .p { margin-top: 18px; font-weight: 800; font-size: 16px; text-align: center; }
.pf .cal .d.win { background: #f0fdf4; } .pf .cal .d.loss { background: #fef2f2; }
.pf .cal .w { background: var(--soft); border-bottom: 1px solid var(--line); text-align: right; padding: 22px 14px; font-size: 14px; color: var(--muted); }
.pf .cal .w b { display: block; color: var(--ink); font-size: 16px; }
.pf .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pf .seg button { border: 0; background: #fff; padding: 9px 16px; cursor: pointer; }
.pf .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.pf .modal { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.pf .modal[hidden] { display: none; }
.pf .modal form { background: #fff; border-radius: 18px; padding: 22px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.pf .modal form h3 { grid-column: 1 / -1; margin: 0; }
.pf .modal label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
.pf .modal label.full { grid-column: 1 / -1; }
.pf .modal input, .pf .modal select { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); background: #fff; }
.pf .modal .row { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; }
.pf .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 30; }
.pf .toast[hidden] { display: none; }
.pf .ico { border: 0; background: transparent; cursor: pointer; font-size: 16px; padding: 4px; }
.pf .empty { color: var(--faint); padding: 20px 0; text-align: center; }
.pf .live { font-size: 11px; font-weight: 800; color: #15803d; background: var(--green-bg); border-radius: 6px; padding: 1px 6px; margin-left: 6px; letter-spacing: .06em; }
.pf svg text { font-family: inherit; }
/* Hoy operas: one focus card with the numbers, then the groups with their accounts inside */
.pf .hoy { margin-bottom: 18px; border: 2px solid #22c55e; }
.pf .hoy-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.pf .hoy-ctl { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pf .seg.mini button { padding: 6px 11px; font-size: 13px; }
.pf .seg .seglab { align-self: center; padding: 0 9px; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--muted); background: var(--soft); border-right: 1px solid var(--line); }
.pf .hero { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 18px; background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; border-radius: 16px; padding: 20px 22px; }
@media (max-width: 900px) { .pf .hero { grid-template-columns: 1fr; } }
.pf .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .16em; color: #86efac; }
.pf .hero-acc { font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 4px; }
.pf .hero-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pf .tagg, .pf .tagm { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.pf .tagg { background: #22c55e; color: #052e16; }
.pf .tagm { background: rgba(148,163,184,.18); color: inherit; border: 1px solid rgba(148,163,184,.35); }
.pf .hero-st { margin-top: 12px; font-size: 15px; color: #e2e8f0; font-weight: 600; }
.pf .steps { display: flex; align-items: stretch; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pf .step { display: grid; gap: 1px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); min-width: 120px; }
.pf .step b { font-size: 14px; } .pf .step small { color: #94a3b8; font-size: 12px; } .pf .step em { font-style: normal; font-size: 13px; color: #cbd5e1; }
.pf .step.now { border-color: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,.35); } .pf .step.now em { color: #86efac; font-weight: 800; }
.pf .step.skip { opacity: .55; } .pf .step.ok em { color: #4ade80; font-weight: 800; } .pf .step.ko em { color: #f87171; font-weight: 800; }
.pf .arrow { align-self: center; color: #64748b; font-weight: 800; }
.pf .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-content: start; }
.pf .tile { display: grid; gap: 4px; background: rgba(255,255,255,.96); color: var(--ink); border-radius: 14px; padding: 12px 14px; }
.pf .tile .tl { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.pf .tile .tv { font-size: 22px; font-weight: 800; letter-spacing: -.02em; display: flex; flex-wrap: wrap; align-items: baseline; }
.pf .tile .sl { color: var(--faint); margin: 0 4px; font-weight: 400; }
.pf .tile .tn { font-size: 12px; color: var(--muted); }
.pf details.full { margin-top: 8px; } .pf details.full summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.pf details.full p { margin: 8px 0 0; color: var(--ink); font-size: 14px; line-height: 1.5; }
.pf .gboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-top: 12px; }
.pf .gbox { border: 1px solid var(--line); background: var(--soft); border-radius: 16px; padding: 14px 16px; }
.pf .gbox.b { border-color: #fde68a; background: #fffbeb; }
.pf .gbox-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .pf .gbox-h b { font-size: 16px; letter-spacing: .02em; }
.pf .gbox-h .tagm { color: var(--muted); } .pf .gbox-h .acts { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pf .gplan { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.pf .gstats { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--muted); } .pf .gstats b { color: var(--ink); }
.pf .accs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.pf .acc { display: grid; gap: 5px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.pf .acc.foco { border: 2px solid #22c55e; box-shadow: 0 2px 10px rgba(34,197,94,.18); }
.pf .acc.muerta { opacity: .6; background: #fafafa; }
.pf .acc.prox { border-style: dashed; background: transparent; cursor: default; color: var(--muted); }
.pf .acc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .pf .acc-top b { font-size: 16px; }
.pf .acc-top .live { margin-left: 0; } .pf .acc-top .pill { padding: 1px 7px; font-size: 11px; }
.pf .acc-pnl { margin-left: auto; font-weight: 800; font-size: 13px; }
.pf .acc-bar { height: 6px; border-radius: 99px; background: #e2e8f0; overflow: hidden; } .pf .acc-bar i { display: block; height: 100%; border-radius: 99px; }
.pf .acc-bar i.g { background: #22c55e; } .pf .acc-bar i.r { background: #ef4444; }
.pf .acc-meta { font-size: 12px; color: var(--faint); } .pf .acc-st { font-size: 13px; font-weight: 700; color: var(--ink); } .pf .acc-when { font-size: 12px; color: var(--muted); }
/* Análisis */
.pf .plan-ok { margin-bottom: 4px; }
.pf .racha { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; }
@media (max-width: 900px) { .pf .racha { grid-template-columns: 1fr; } }
.pf .racha .big { font-size: 56px; font-weight: 800; letter-spacing: -.04em; color: var(--green); line-height: 1; margin-right: 10px; }
.pf .racha .big2 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; display: block; }
.pf .racha .lab { color: var(--muted); font-size: 14px; }
.pf .meta5 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .pf .meta5 i { width: 34px; height: 12px; border-radius: 99px; background: #e2e8f0; }
.pf .meta5 i.on { background: #22c55e; } .pf .meta5 span { color: var(--muted); font-size: 14px; margin-left: 8px; }
.pf .diasplan { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 16px; }
.pf .dp { display: grid; gap: 3px; border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); font-size: 13px; }
.pf .dp.ok { background: #f0fdf4; border-color: #bbf7d0; } .pf .dp.ko { background: #fef2f2; border-color: #fecaca; }
.pf .dp b { font-size: 14px; } .pf .dp small { color: var(--red); }
.pf .concl { margin: 8px 0 0; font-size: 15px; line-height: 1.5; }
.pf .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.pf .vsc { display: grid; gap: 4px; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px; font-size: 13px; color: var(--muted); }
.pf .vsc b { color: var(--ink); font-size: 15px; } .pf .vsc .vv { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.pf .rachab { display: flex; width: 100%; text-align: left; cursor: pointer; margin-bottom: 8px; font: inherit; font-weight: 700; }
.pf details.ahora { margin-bottom: 18px; border: 2px solid #f59e0b; } .pf details.ahora summary { display: flex; align-items: center; gap: 12px; cursor: pointer; list-style: none; }
.pf details.ahora summary::-webkit-details-marker { display: none; } .pf details.ahora[open] summary { margin-bottom: 14px; }
.pf details.ahora .cuenta { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--green-bg); color: #15803d; } .pf details.ahora .cuenta.hay { background: #fef3c7; color: #92400e; }
.pf details.ahora .plegar { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 600; } .pf details.ahora .plegar::after { content: "Mostrar ▾"; } .pf details.ahora[open] .plegar::after { content: "Ocultar ▴"; }
.pf .rachab span { margin-left: auto; opacity: .8; }
/* Análisis: explanations and the week map */
.pf .kpi .lab { align-items: center; } .pf details.exp { position: relative; letter-spacing: 0; }
.pf details.exp summary { list-style: none; cursor: pointer; color: var(--faint); font-size: 14px; } .pf details.exp summary::-webkit-details-marker { display: none; }
.pf details.exp p { position: absolute; right: 0; top: 22px; z-index: 3; width: 240px; margin: 0; background: var(--navy); color: #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 500; line-height: 1.45; text-transform: none; box-shadow: 0 8px 24px rgba(15,23,42,.25); }
.pf .heat { display: grid; gap: 3px; margin-top: 12px; } .pf .heat span { font-size: 11px; color: var(--muted); text-align: center; }

<div class="pf" id="pf">

<script>
(() => {
"use strict";
// Plan de Futuros · Tracker. Data lives in the artifact's database under fm/plan/*; accounts linked to
// Topstep (topstepId) take their balance from fm/topstep, which Jarvis's scheduled reads keep fresh.
const ROOT = window.__PLAN_ROOT || document;
const $ = (s) => ROOT.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => new Intl.NumberFormat("es-ES", { style: "currency", currency: "USD", minimumFractionDigits: 2 }).format(Number(n) || 0);
const signed = (n) => (n > 0 ? "+" : "") + money(n);
const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "pos");
const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const MESES_L = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const fecha = (iso) => { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${+d} ${MESES[+m - 1]} ${y}`; };
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const monday = (s) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const ESTADOS = ["ACTIVA", "EXAM", "STANDBY", "PENDIENTE", "PERDIDA"];
const ESTADO_DOT = { ACTIVA: "#16a34a", EXAM: "#eab308", STANDBY: "#cbd5e1", PENDIENTE: "#e2e8f0", PERDIDA: "#dc2626" };
const ESTADO_COLOR = { ACTIVA: "#22c55e", EXAM: "#eab308", STANDBY: "#94a3b8", PENDIENTE: "#cbd5e1", PERDIDA: "#ef4444" };
const GRUPO_ESTADOS = { MAESTRA: "👑 MAESTRA", ACTIVO: "🔄 ACTIVO", PAUSADO: "⏸️ PAUSADO", RESERVA: "⚪ RESERVA" };
const ICONO = (g, i) => (g.estado === "MAESTRA" ? "🥇" : i === 1 ? "🥈" : "📊");
const ACCIONES = ["Liquidar", "Cerrar y bloquear", "Solo alertar"];
const TABS = [["dashboard", "Dashboard"], ["analisis", "📊 Análisis"], ["grupos", "Grupos"], ["cuentas", "Cuentas"], ["operaciones", "Operaciones"], ["semanas", "Semanas"],
              ["reglas", "Reglas"], ["backtest", "📒 Backtesting"], ["domingo", "📋 Domingo"], ["riesgo", "⚙️ Riesgo"], ["calendario", "📅 Calendario"]];

const S = { tab: "dashboard", grupos: new Map(), cuentas: new Map(), ops: new Map(), semanas: new Map(), revisiones: new Map(), topstep: null,
            ready: false, db: null, ahoraAbierto: (() => { try { return localStorage.getItem("pf-ahora") !== "0"; } catch { return true; } })(), rpSes: new Map(), replayIdx: null, rp: null, rpT: 0, page: { cuentas: 0, ops: 0 }, f: { chip: "todos", cg: "", ct: "", ce: "", og: "", oc: "", or: "", oq: "", rq: "", rg: "" },
            cal: { y: new Date().getFullYear(), m: new Date().getMonth(), modo: "pct", g: "", c: "", anual: false }, risk: {}, sel: new Set(), rev: null };
try { S.tab = localStorage.getItem("pf-tab") || "dashboard"; } catch {}
if (!TABS.some(([k]) => k === S.tab)) S.tab = "dashboard";

const list = (m) => [...m.entries()].map(([id, v]) => ({ id, ...v }));
const grupos = () => list(S.grupos).sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99));
const cuentas = () => list(S.cuentas).sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99) || String(a.codigo).localeCompare(b.codigo));
// Operations: the ones Joel logs plus, for accounts linked to Topstep, every trade Jarvis reads from Topstep.
const tsOps = () => cuentas().flatMap((c) => (ts(c)?.trades || []).map((t) => ({ ...t, id: "ts-" + t.id, cuenta: c.id, auto: true, creado: t.cierra })));
const ops = () => [...list(S.ops), ...tsOps()].sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || (b.creado || "").localeCompare(a.creado || ""));
const gName = (id) => S.grupos.get(id)?.nombre || "—";
const cCode = (id) => S.cuentas.get(id)?.codigo || "—";

// Topstep: a linked account's P&L is its live balance minus the starting balance.
const ts = (c) => (c.topstepId && S.topstep?.cuentas?.[c.topstepId]?.balance != null ? S.topstep.cuentas[c.topstepId] : null);
const pnl = (c) => { const t = ts(c); return t ? Math.round((t.balance - (Number(c.balanceIni) || 0)) * 100) / 100 : Number(c.pnl) || 0; };
// Day P&L per account: Topstep's days for linked accounts, otherwise the logged operations.
function dayMap() {
  const m = {};
  for (const c of cuentas()) {
    const t = ts(c), days = {};
    if (t && t.dias) Object.assign(days, t.dias);
    else for (const o of ops()) if (o.cuenta === c.id && o.fecha) days[o.fecha] = (days[o.fecha] || 0) + (Number(o.pnl) || 0);
    m[c.id] = days;
  }
  return m;
}
const capital = (cs) => cs.reduce((a, c) => a + (Number(c.balanceIni) || 0), 0);
// Today's trading day as Topstep counts it (a session that opens at 17:00 Chicago belongs to the next date).
const tradingDay = (t) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(new Date(t).getTime() + 7 * 3600 * 1000));
// Watching the daily limits: today's P&L of each live account linked to Topstep against its loss limit and profit target.
const NIVEL = { dll80: "⚠️ Cerca del límite", dll100: "🛑 Límite pasado", dpt100: "🎯 Objetivo alcanzado" };
function vigil() {
  const hoy = tradingDay(Date.now());
  return cuentas().filter((c) => ts(c) && (c.estado === "ACTIVA" || c.estado === "EXAM")).map((c) => {
    const r = riskOf(c), v = Math.round(((ts(c).dias || {})[hoy] || 0) * 100) / 100;
    const dll = r.dllOn ? Number(r.dll) || null : null, dpt = r.dptOn ? Number(r.dpt) || null : null;
    return { c, r, hoy: v, dll, dpt, nivel: dll && v <= -dll ? "dll100" : dll && v <= -0.8 * dll ? "dll80" : dpt && v >= dpt ? "dpt100" : null };
  });
}
function grupoStats(g, days = dayMap()) {
  const cs = cuentas().filter((c) => c.grupo === g.id);
  const lunes = monday(iso(new Date()));
  let semana = 0;
  for (const c of cs) for (const [d, v] of Object.entries(days[c.id] || {})) if (d >= lunes && d < addDays(lunes, 7)) semana += v;
  const total = cs.reduce((a, c) => a + pnl(c), 0), cap = capital(cs), slTot = cs.reduce((a, c) => a + Math.abs(Number(c.sl) || 0), 0);
  return { cs, activas: cs.filter((c) => c.estado === "ACTIVA" || c.estado === "EXAM").length, verdes: cs.filter((c) => pnl(c) > 0).length,
           rojas: cs.filter((c) => pnl(c) < 0).length, semana, total, cap, semanaPct: cap ? semana / cap : 0,
           dd: slTot && total < 0 ? Math.round((-total / slTot) * 100) : 0, examen: cs.filter((c) => c.estado === "EXAM").length };
}
function pausa() {
  const days = dayMap();
  const malos = grupos().filter((g) => g.estado === "ACTIVO" || g.estado === "MAESTRA").map((g) => [g, grupoStats(g, days)]).filter(([, s]) => s.semanaPct <= -0.05);
  return malos.length ? { ok: false, txt: "⛔ PAUSAR COPIADOR — " + malos.map(([g, s]) => `${g.nombre} ${(s.semanaPct * 100).toFixed(1)}%`).join(", ") + " esta semana (umbral -5%)" }
                      : { ok: true, txt: "✅ OPERAR NORMAL — Ningún grupo ha superado el umbral de pausa del -5%" };
}

// ── charts (plain SVG) ─────────────────────────────────────────
function bars(series, labels, { h = 230, money: m = true } = {}) {
  const all = series.flatMap((s) => s.values), max = Math.max(1, ...all.map((v) => Math.abs(v))), neg = all.some((v) => v < 0);
  const W = 640, pad = 54, top = 30, bot = 30, ch = h - top - bot, zero = neg ? top + ch / 2 : top + ch;
  const scale = (v) => (neg ? (v / max) * (ch / 2) : (v / max) * ch);
  const gw = (W - pad - 10) / Math.max(1, labels.length), bw = Math.min(46, (gw - 16) / series.length);
  let out = `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">`;
  out += series.map((s, i) => `<rect x="${W / 2 - 110 + i * 110}" y="4" width="22" height="13" fill="${s.color}"/><text x="${W / 2 - 82 + i * 110}" y="15" font-size="13" fill="#475569">${esc(s.name)}</text>`).join("");
  for (let k = 0; k <= 4; k++) { const v = neg ? max - (k * 2 * max) / 4 : max - (k * max) / 4, y = top + (k * ch) / 4;
    out += `<line x1="${pad}" x2="${W - 10}" y1="${y}" y2="${y}" stroke="#eef2f7"/><text x="${pad - 8}" y="${y + 4}" font-size="12" fill="#64748b" text-anchor="end">${m ? "$" + (Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + "k" : +v.toFixed(1)) : v}</text>`; }
  labels.forEach((l, j) => {
    series.forEach((s, i) => { const v = s.values[j] || 0, hh = Math.abs(scale(v)), x = pad + j * gw + (gw - bw * series.length) / 2 + i * bw;
      out += `<rect x="${x}" y="${v >= 0 ? zero - hh : zero}" width="${bw - 4}" height="${hh}" rx="4" fill="${v < 0 ? "#ef4444" : s.color}"/>`; });
    out += `<text x="${pad + j * gw + gw / 2}" y="${h - 8}" font-size="13" fill="#64748b" text-anchor="middle">${esc(l)}</text>`;
  });
  return out + `<line x1="${pad}" x2="${W - 10}" y1="${zero}" y2="${zero}" stroke="#cbd5e1"/></svg>`;
}
function donut(parts) {
  const tot = parts.reduce((a, p) => a + p.v, 0) || 1, R = 100, r = 52, cx = 130, cy = 130;
  let a0 = -Math.PI / 2, out = `<svg viewBox="0 0 420 260" width="100%" role="img">`;
  for (const p of parts) { if (!p.v) continue; const a1 = a0 + (p.v / tot) * Math.PI * 2 - 1e-6, big = a1 - a0 > Math.PI ? 1 : 0;
    const P = (a, rr) => `${cx + rr * Math.cos(a)} ${cy + rr * Math.sin(a)}`;
    out += `<path d="M ${P(a0, R)} A ${R} ${R} 0 ${big} 1 ${P(a1, R)} L ${P(a1, r)} A ${r} ${r} 0 ${big} 0 ${P(a0, r)} Z" fill="${p.color}" stroke="#fff" stroke-width="3"/>`; a0 = a1; }
  parts.forEach((p, i) => { out += `<rect x="282" y="${62 + i * 30}" width="13" height="13" fill="${p.color}"/><text x="303" y="${73 + i * 30}" font-size="14" fill="#475569">${esc(p.name)}</text>`; });
  return out + "</svg>";
}

// ── views ──────────────────────────────────────────────────────
const V = {};
V.dashboard = () => {
  const cs = cuentas(), os = ops(), days = dayMap(), p = pausa();
  const total = cs.reduce((a, c) => a + pnl(c), 0), cap = capital(cs.filter((c) => c.estado === "ACTIVA" || c.estado === "EXAM"));
  const tp = os.filter((o) => o.resultado === "TP" || (o.resultado !== "SL" && o.resultado !== "BE" && Number(o.pnl) > 0)).length;
  const wr = os.length ? ((tp / os.length) * 100).toFixed(1) + "%" : "—";
  const gs = grupos().filter((g) => g.estado !== "RESERVA");
  const sem = semanasAll(days).sort((a, b) => (a.inicio || "").localeCompare(b.inicio || ""));
  const labels = [...new Set(sem.map((s) => s.semana))];
  const g12 = grupos().filter((g) => g.estado === "ACTIVO").slice(0, 2);
  const series = g12.map((g, i) => ({ name: g.nombre, color: i ? "#3b82f6" : "#22c55e",
    values: labels.map((l) => { const w = sem.find((s) => s.semana === l && s.grupo === g.id); return w ? semanaStats(w, days).pnl : 0; }) }));
  const top = cs.map((c) => [c, pnl(c)]).filter(([, v]) => v).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const alertas = vigil().filter((x) => x.nivel);
  // what his rules say right now goes first, in one box he can fold: the rules engine, his limits today, the plan streak and the copier pause
  const extra = rachaHtml() + `<div class="banner ${p.ok ? "ok" : "bad"}" style="margin-bottom:8px">${esc(p.txt)}</div>${alertas.map((x) => `<div class="banner warn" style="margin-bottom:8px">${NIVEL[x.nivel]} · ${esc(x.c.codigo)} lleva ${x.hoy > 0 ? "+" : ""}${money(x.hoy)} hoy</div>`).join("")}`;
  return ahoraHtml({ extra, plegable: true, nAlertas: alertas.length + (p.ok ? 0 : 1) }) + hoyHtml() + `
  <div class="grid4">
    <div class="card kpi"><div class="lab">P&amp;L TOTAL SISTEMA <span>💰</span></div><div class="val ${cls(total)}">${money(total)}</div></div>
    <div class="card kpi"><div class="lab">CAPITAL BAJO GESTIÓN <span>🏦</span></div><div class="val blue">${money(cap)}</div></div>
    <div class="card kpi"><div class="lab">CUENTAS ACTIVAS <span>✅</span></div><div class="val pos">${cs.filter((c) => c.estado === "ACTIVA").length}</div></div>
    <div class="card kpi"><div class="lab">WIN RATE GLOBAL <span>🎯</span></div><div class="val pos">${wr}</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>P&amp;L Semanal por Grupo</h3><p class="hint">${esc(gs.map((g) => g.nombre + (g.ratio ? ` (${g.ratio})` : "")).join(" · "))}</p>
      ${labels.length ? bars(series, labels) : '<p class="empty">Añade semanas en la pestaña Semanas.</p>'}</div>
    <div class="card"><h3>Resumen de Grupos</h3><p class="hint">Estado actual de cada grupo activo</p>
      ${gs.map((g, i) => { const s = grupoStats(g, days); return `<div class="gcard"><div class="top"><span>${ICONO(g, i)} ${esc(g.nombre)} — ${esc(g.empresa)}</span><span class="${cls(s.total)}">${signed(s.total)}</span></div>
        <div class="meta"><span>Estado <b>${GRUPO_ESTADOS[g.estado] || esc(g.estado)}</b></span><span>Cuentas <b>${s.cs.length}</b></span><span>Verdes <b>${s.verdes}</b></span><span>Rojas <b>${s.rojas}</b></span></div>
        <div class="meta"><span>Challenge <b>${s.examen ? s.examen + " en examen" : "—"}</b></span></div><div class="meta">${s.cs.map((c) => `<span class="pill st-${esc(c.estado)}">${esc(c.codigo)} ${signed(pnl(c))}</span>`).join("") || "Sin cuentas"}</div></div>`; }).join("")}</div>
    <div class="card"><h3>Distribución de cuentas</h3><p class="hint">Por estado actual</p>
      ${donut(ESTADOS.map((e) => ({ name: e, v: cs.filter((c) => c.estado === e).length, color: ESTADO_COLOR[e] })))}</div>
    <div class="card"><h3>P&amp;L acumulado por cuenta</h3><p class="hint">Top cuentas por resultado</p>
      ${top.length ? bars([{ name: "P&L", color: "#22c55e", values: top.map(([, v]) => v) }], top.map(([c]) => c.codigo)) : '<p class="empty">Aún no hay resultados.</p>'}</div>
  </div>`;
};
// What each group is for, in a few words
const papelG = (g) => (g.estado === "MAESTRA" ? "Opera aquí y el copiador manda el trade a las copias" : g.estado === "RESERVA" ? "Reserva: entran cuando una cuenta se quema o pasa"
  : g.estado === "ACTIVO" ? planCorto(modoG(g.id), est()) : "En pausa");
// Groups as boxes with their accounts inside: live ones first, then the burned or passed ones, then the ones booked to buy
function grupoBox(g, days) {
  const s = grupoStats(g, days), dia = tradingDay(Date.now()), h = g.estado === "ACTIVO" ? hoyOperas() : null;
  const cs = [...s.cs].sort((a, b) => Number(!vivaC(a)) - Number(!vivaC(b)) || (Number(a.orden) || 0) - (Number(b.orden) || 0));
  const prox = (S.autoreg?.proximas || []).filter((x) => x && x.grupo === g.id && !cuentas().some((c) => c.codigo === x.codigo));
  return `<div class="gbox"><div class="gbox-h"><b>${esc(g.nombre)}</b><span class="tagm">${g.estado === "ACTIVO" ? (modoG(g.id) === "londres" ? "Londres + NY" : "2 balas") : GRUPO_ESTADOS[g.estado] || esc(g.estado)}</span>
      <span class="acts"><span class="${cls(s.total)}" style="font-weight:800">${sgn(s.total)}</span><button class="ico" type="button" data-edit="grupo" data-id="${g.id}" title="Editar grupo">✏️</button></span></div>
    <p class="gplan">${esc(papelG(g))}</p>
    <div class="gstats"><span>Vivas <b>${s.activas}</b></span><span>Esta semana <b class="${cls(s.semana)}">${sgn(s.semana)}</b></span><span>Verdes <b>${s.verdes}</b></span><span>Rojas <b>${s.rojas}</b></span>${s.dd ? `<span>Drawdown <b>${s.dd} %</b></span>` : ""}${g.ratio ? `<span>Copia <b>${esc(g.ratio)}</b></span>` : ""}</div>
    <div class="accs">${cs.map((c) => { const foco = !!(h && h.foco && h.foco.cuentas.some((y) => y.id === c.id)), n = vivaC(c) ? tradesDia(c, dia).length : 0;
        return cuentaChip(c, { foco, estado: !h || !vivaC(c) ? "" : foco ? "▶ Hoy en foco" : n ? sgn(tradesDia(c, dia).reduce((a, y) => a + y.pnl, 0)) + " hoy" : "En espera",
          cuando: c.quemada ? "quemada el " + c.quemada.split("-").reverse().join("/") : "" }); }).join("")}
      ${prox.map((x) => `<div class="acc prox"><span class="acc-top"><b>${esc(x.codigo)}</b></span><span class="acc-meta">por comprar${x.estado ? " · " + esc(x.estado) : ""}</span><span class="acc-when">Jarvis la registra aquí sola</span></div>`).join("")}
      ${!cs.length && !prox.length ? '<p class="hint" style="margin:0">Sin cuentas.</p>' : ""}</div></div>`;
}
V.grupos = () => {
  const days = dayMap(), rk = { ACTIVO: 0, MAESTRA: 1, PAUSADO: 2, RESERVA: 3 }, gs = grupos().filter((g) => S.f.chip === "todos" || g.id === S.f.chip).sort((a, b) => (rk[a.estado] ?? 2) - (rk[b.estado] ?? 2));
  return `<div class="chips">${[["todos", "Todos"], ...grupos().map((g) => [g.id, g.nombre])].map(([k, n]) => `<button type="button" data-chip="${esc(k)}" aria-pressed="${S.f.chip === k}">${esc(n)}</button>`).join("")}</div>
  <div class="card" style="margin-bottom:18px"><div class="cardhead"><div><h3>Grupos y sus cuentas</h3><p class="hint">Máximo 2 grupos activos simultáneos. Toca una cuenta para editarla o cambiarla de grupo.</p></div><button class="btn green" type="button" data-new="grupo">+ Nuevo grupo</button></div>
  <div class="gboard" style="margin-top:0">${gs.map((g) => grupoBox(g, days)).join("") || '<p class="empty">Sin grupos todavía.</p>'}</div></div>
  ${repartoHtml()}`;
};
function repartoHtml() {
  const cambios = reparto(), gs = rotan();
  return `<div class="card" style="margin-bottom:18px"><div class="cardhead"><div><h3>🔀 Reparto automático</h3>

  if (k === "vela") { R.play = false; const tf = R.tf || 1, fin = R.dia.c.length - 1, g = (j) => Math.floor(R.dia.m[j] / tf);

    if (!S.db) return toast("Abre el Plan dentro de Claude para guardar.");
    const g = estadisticas(R.trades), id = R.fecha + "-" + Date.now().toString(36);
    await S.db.doc("fm/replay").collection("sesiones").doc(id).set({ fecha: R.fecha, n: R.trades.length, pnl: Math.round(g.total * 100) / 100, wr: g.wr, pf: g.pf === Infinity ? null : g.pf,

(async () => {
