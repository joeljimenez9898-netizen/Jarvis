<title>Capital propio</title>
<style>
.cp { --bg: #000; --surface: #0D0E10; --raised: #141517; --border: #1C1D20; --borderLight: #28292D; --text: #EEF0F1; --muted: #8B9096;
      --faint: #55585C; --accent: #00D991; --accentSoft: rgba(0,217,145,.14); --coral: #FF6B6B; --coralSoft: rgba(255,107,107,.14);
      background: var(--bg); min-height: 100%; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
.cp * { box-sizing: border-box; }
.cp button, .cp input { font-family: inherit; }
.cp button { cursor: pointer; }
.cp button:focus-visible, .cp input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cp input[type=number] { font-variant-numeric: tabular-nums; }
.cp .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; padding-top: max(32px, env(safe-area-inset-top)); }
.cp #cp-back { background: var(--raised); color: var(--text); border: 1px solid var(--borderLight); border-radius: 10px; padding: 8px 14px; font-weight: 600; margin-bottom: 20px; }
.cp #cp-back[hidden] { display: none; }
.cp .kick { font-size: 11px; color: var(--accent); letter-spacing: .14em; margin-bottom: 8px; font-weight: 600; }
.cp h1 { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
.cp .lede { font-size: 14px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.cp .hero { background: linear-gradient(135deg, var(--accentSoft), transparent 60%); border: 1px solid var(--accent); border-radius: 18px; padding: 26px 28px;
            margin: 28px 0; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; }
.cp .lab { font-size: 11px; color: var(--muted); letter-spacing: .08em; margin-bottom: 6px; }
.cp .big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
.cp .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.cp .win { display: flex; align-items: center; gap: 6px; background: var(--accent); border: 0; color: #00140D; padding: 11px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 700; }
.cp .loss { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--coral); color: var(--coral); padding: 11px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 700; }
.cp .sec { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.cp .sec b { font-size: 11px; color: var(--accent); letter-spacing: .05em; } .cp .sec span { font-size: 15px; font-weight: 700; }
.cp .cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 14px; }
.cp .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; }
.cp .card.acc { border-color: var(--accent); }
.cp .card h3 { font-size: 14.5px; margin: 0 0 12px; } .cp .card.acc h3 { color: var(--accent); }
.cp .item { display: flex; gap: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-bottom: 8px; }
.cp .item i { color: var(--faint); font-style: normal; } .cp .card.acc .item i { color: var(--accent); }
.cp .foot { font-size: 12px; font-weight: 700; color: var(--faint); padding-top: 10px; border-top: 1px solid var(--border); margin-top: auto; }
.cp .card.acc .foot { color: var(--accent); }
.cp .note { background: var(--raised); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px; padding: 14px 16px; font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 32px; }
.cp .two { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(260px, 1.1fr); gap: 14px; margin-bottom: 32px; }
@media (max-width: 640px) { .cp .two { grid-template-columns: 1fr; } }
.cp .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cp .f { display: block; } .cp .f.full { grid-column: 1 / -1; }
.cp .f span { display: block; font-size: 10.5px; color: var(--faint); margin-bottom: 5px; line-height: 1.3; }
.cp .f input { width: 100%; background: var(--raised); border: 1px solid var(--borderLight); border-radius: 7px; padding: 9px 10px; color: var(--text); font-size: 14px; }
.cp .f.hi input { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.cp .outs { display: flex; flex-direction: column; gap: 10px; }
.cp .out { background: linear-gradient(135deg, var(--accentSoft), transparent 70%); border: 1px solid var(--accent); border-radius: 14px; padding: 16px 18px; }
.cp .out.neg { background: linear-gradient(135deg, var(--coralSoft), transparent 70%); border-color: var(--coral); }
.cp .out .v { font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -.01em; } .cp .out.neg .v { color: var(--coral); }
.cp .out .s { font-size: 12px; color: var(--muted); margin-top: 4px; } .cp .out .d { font-size: 11px; color: var(--faint); margin-top: 6px; line-height: 1.4; }
.cp .shield { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 16px 18px; background: var(--accentSoft); border: 1px solid var(--accent); }
.cp .shield.bad { background: var(--coralSoft); border-color: var(--coral); }
.cp .shield b { font-size: 13.5px; color: var(--accent); } .cp .shield.bad b { color: var(--coral); }
.cp .shield small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.cp .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--raised); border-left: 3px solid var(--accent); border-radius: 8px; margin-bottom: 6px; }
.cp .row.l { border-left-color: var(--coral); }
.cp .row span { font-size: 12.5px; color: var(--muted); } .cp .row b { font-size: 13px; color: var(--accent); } .cp .row.l b { color: var(--coral); }
.cp .ghost { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--border); color: var(--faint); padding: 8px 14px; border-radius: 8px; font-size: 12px; margin-top: 12px; }
.cp .reset { display: block; margin: 32px auto 0; }
.cp .empty { font-size: 13px; color: var(--faint); }
.cp .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--accent); color: var(--text); padding: 10px 16px; border-radius: 10px; z-index: 30; font-size: 13px; }
.cp .toast[hidden] { display: none; }
</style>
<div class="cp" id="cp">
  <div class="wrap">
    <button id="cp-back" type="button" hidden>← Galaxia</button>
    <div id="cp-view"></div>
  </div>
  <div class="toast" id="cp-toast" hidden></div>
</div>
<script>
(() => {
"use strict";
// Capital propio: 4.5 % compounded on today's balance. Saved in the artifact's database (fm/capital).
const ROOT = window.__CAP_ROOT || document;
const $ = (s) => ROOT.querySelector(s);
const DEF = { saldoInicial: 1000, stopsMaxDia: 2, winrate: 82, riesgoPct: 4.5, ratioTpSl: 0.31, opsPorDia: 4, rachaMaxima: 3, maxPerdidaAceptada: 30, margenSeguridad: 2 };
// Joel's money rules: how each funded payout is split, when and how much to take out of his own capital,
// when to add to it, and how risk climbs as the account grows. Starting values; he sets his own.
const PLAN_DEF = { pctCapital: 30, pctExamenes: 20, pctTuyo: 30, pctImpuestos: 20, cambio: 0.92,
                   frecuencia: "mensual", pctRetiro: 30, esperaSiCae: 10, riesgoBase: 4.5, cadaPct: 25, subePuntos: 0.5, riesgoMax: 6, bajaSiCae: 10 };
const S = { inputs: { ...DEF }, plan: { ...PLAN_DEF }, log: [], db: null, saveT: null };
const eur = (n) => { const v = Number(n || 0); return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toLocaleString("es-ES", { maximumFractionDigits: 0 }) + " €"; };
const pct = (n, d = 1) => `${Number(n || 0).toFixed(d)}%`;
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const saldo = () => (S.log.length ? S.log[S.log.length - 1].balanceAfter : S.inputs.saldoInicial);

// ── plan de dinero ─────────────────────────────────────────────
const isTrade = (e) => e.resultado === "win" || e.resultado === "loss";
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function reparto(usd) {
  const P = S.plan, x = Math.abs(Number(usd) || 0), part = (p) => Math.round(x * p) / 100;
  return { usd: x, capitalUsd: part(P.pctCapital), capitalEur: Math.round(part(P.pctCapital) * P.cambio * 100) / 100, examenes: part(P.pctExamenes), tuyo: part(P.pctTuyo),
           impuestos: part(P.pctImpuestos), suma: P.pctCapital + P.pctExamenes + P.pctTuyo + P.pctImpuestos };
}
function textoReparto(usd) {
  const r = reparto(usd), $ = (n) => n.toLocaleString("es-ES", { maximumFractionDigits: 2 }) + " $";
  return "Según su plan de dinero, de esos " + $(r.usd) + ": " + $(r.capitalUsd) + " a capital propio (unos " + Math.round(r.capitalEur) + " €), " + $(r.examenes) +
    " para más exámenes, " + $(r.tuyo) + " para usted y " + $(r.impuestos) + " apartados para Hacienda.";
}
function periodo() {
  const now = new Date(), P = S.plan;
  if (P.frecuencia === "semanal") {
    const lunes = new Date(now); lunes.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    const viernes = new Date(lunes); viernes.setDate(lunes.getDate() + 4);
    return { desde: iso(lunes), dia: iso(viernes), nombre: "esta semana", cuando: "el viernes" };
  }
  const fin = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  return { desde: iso(new Date(now.getFullYear(), now.getMonth(), 1)), dia: iso(fin), nombre: "este mes", cuando: "el último día del mes" };
}
function dinero() {
  const P = S.plan, I = S.inputs, s = saldo(), per = periodo(), hoy = today();
  const aportes = S.log.filter((e) => e.resultado === "aporte").reduce((a, e) => a + e.importe, 0);
  const aportado = I.saldoInicial + aportes;
  const enPeriodo = S.log.filter((e) => e.date >= per.desde);
  const beneficio = enPeriodo.filter(isTrade).reduce((a, e) => a + (e.balanceAfter - e.balanceBefore), 0);
  const retirado = enPeriodo.filter((e) => e.resultado === "retiro").reduce((a, e) => a + e.importe, 0);
  const sugerido = Math.max(0, Math.min(beneficio * P.pctRetiro / 100 - retirado, s - aportado));
  // the peak since the last time money went in or out
  let desde = 0; S.log.forEach((e, i) => { if (!isTrade(e)) desde = i; });
  const pico = Math.max(I.saldoInicial, ...S.log.slice(desde).map((e) => e.balanceAfter));
  const caida = pico > 0 ? (1 - s / pico) * 100 : 0;
  const crec = (s / aportado - 1) * 100;
  let escalon = Math.max(0, Math.floor(crec / P.cadaPct));
  if (caida >= P.bajaSiCae && escalon > 0) escalon -= 1;
  const tope = Math.min(P.riesgoMax, calc().riesgoQueDiceTuRacha || P.riesgoMax);
  const recomendado = Math.round(Math.min(tope, P.riesgoBase + escalon * P.subePuntos) * 100) / 100;
  const siguiente = aportado * (1 + ((Math.floor(Math.max(0, crec) / P.cadaPct) + 1) * P.cadaPct) / 100);
  return { periodo: per, beneficio, retirado, sugerido, hoyToca: hoy === per.dia, aportado, pico, caida, crec, escalon, recomendado, tope, siguiente,
           puedeAportar: caida < P.esperaSiCae };
}
// ── the proposal: from Joel's numbers (capital, winrate, ratio, trades a day, worst streak, max loss), the risk plan
// that fits them. Fixed formulas, nothing invented: expectancy, a quarter of Kelly, and the worst losing streak to expect.
function recomendar(o = {}) {
  const I = { ...S.inputs, ...o }, w = I.winrate / 100, R = I.ratioTpSl, maxP = I.maxPerdidaAceptada / 100;
  const r2 = (n) => Math.round(n * 100) / 100, abajo = (n, paso) => Math.floor(n / paso + 1e-9) * paso;
  const es = (n) => String(Math.round(n * 100) / 100).replace(".", ",");
  const esperanza = w * R - (1 - w);                                        // what an average trade earns, in units of risk
  const kelly = R > 0 ? w - (1 - w) / R : 0;
  const opsAno = Math.max(1, I.opsPorDia * 250);
  const rachaEstadistica = w < 1 && w > 0 ? Math.log(opsAno) / Math.log(1 / (1 - w)) : 0;    // the longest losing streak a year of trading tends to bring
  const racha = Math.max(I.rachaMaxima, Math.ceil(rachaEstadistica));
  const porRacha = (1 - Math.pow(1 - maxP, 1 / Math.max(1, racha * I.margenSeguridad))) * 100;
  const porKelly = Math.max(0, kelly * 100 / 4);
  const riesgo = esperanza > 0 ? Math.max(0.25, abajo(Math.min(porKelly, porRacha), 0.25)) : 0.5;
  const stops = Math.max(1, Math.min(4, Math.floor(Math.log(1 - maxP / 3) / Math.log(1 - riesgo / 100))));
  const maxRiesgo = esperanza > 0 ? Math.max(riesgo, abajo(Math.min(porKelly, (1 - Math.pow(1 - maxP, 1 / Math.max(1, I.rachaMaxima * I.margenSeguridad))) * 100), 0.25)) : riesgo;
  const plan = { riesgoBase: riesgo, cadaPct: 25, subePuntos: Math.max(0.1, r2(abajo(riesgo * 0.1, 0.05))), riesgoMax: r2(maxRiesgo), bajaSiCae: Math.round(maxP * 100 / 3),
                 frecuencia: "mensual", pctRetiro: 25, esperaSiCae: Math.round(maxP * 100 / 3) };
  const gananciaDia = I.saldoInicial * (riesgo / 100) * esperanza * I.opsPorDia;
  return { inputs: I, esperanza: r2(esperanza), kelly: r2(kelly * 100), porKelly: r2(porKelly), rachaEstadistica: r2(rachaEstadistica), racha, porRacha: r2(porRacha),
           riesgo, stops, plan, gananciaDia: r2(gananciaDia), sinVentaja: esperanza <= 0,
           porque: esperanza <= 0
             ? "Con un winrate del " + I.winrate + " % y un ratio de " + es(R) + ", cada operación pierde de media (" + es(esperanza) + " veces lo que arriesgas): ningún riesgo hace ganar dinero así. Lo primero es mejorar el sistema; mientras, riesgo mínimo."
             : "Cada operación gana de media " + es(esperanza) + " veces lo que arriesgas. La fórmula de Kelly dice " + es(kelly * 100) + " %, pero se usa una cuarta parte (" + es(porKelly) + " %) para aguantar las rachas. " +
               "Con " + I.opsPorDia + " operaciones al día, lo normal es que en un año te toque una racha de unas " + Math.ceil(rachaEstadistica) + " pérdidas seguidas; contando tu margen de " + I.margenSeguridad + "x, para no perder más del " + I.maxPerdidaAceptada + " % el riesgo no debe pasar del " + es(porRacha) + " %. Te quedas con el menor: " + es(riesgo) + " %." };
}
function aplicarPropuesta(rec) {
  for (const k of ["saldoInicial", "winrate", "ratioTpSl", "opsPorDia", "rachaMaxima", "maxPerdidaAceptada", "margenSeguridad"]) if (Number.isFinite(rec.inputs[k])) S.inputs[k] = rec.inputs[k];
  S.inputs.riesgoPct = rec.riesgo; S.inputs.stopsMaxDia = rec.stops; S.plan = { ...S.plan, ...rec.plan }; render(); save();
}
function calc() {
  const I = S.inputs, s = saldo(), r = I.riesgoPct / 100;
  const arriesgasHoy = s * r, objetivoGanancia = arriesgasHoy * I.ratioTpSl;
  const drawdownDiario = 1 - Math.pow(1 - r, I.stopsMaxDia), dineroDrawdownDiario = s * drawdownDiario;
  const maxP = I.maxPerdidaAceptada / 100, margenSeguro = I.rachaMaxima * I.margenSeguridad;
  // risk % such that "margenSeguro" losses in a row land exactly on the maximum accepted loss
  const riesgoQueDiceTuRacha = margenSeguro > 0 ? (1 - Math.pow(1 - maxP, 1 / margenSeguro)) * 100 : 0;
  const stopsHastaLimite = r > 0 ? Math.log(1 - maxP) / Math.log(1 - r) : Infinity;
  return { arriesgasHoy, objetivoGanancia, drawdownDiario, dineroDrawdownDiario, riesgoQueDiceTuRacha,
           dineroDeEseRiesgo: s * (riesgoQueDiceTuRacha / 100), margenSeguro, stopsHastaLimite, esSeguro: stopsHastaLimite >= margenSeguro };
}

const num = (k, label, { step = 1, hi = false, full = false } = {}) =>
  `<label class="f${hi ? " hi" : ""}${full ? " full" : ""}"><span>${label}</span><input type="number" inputmode="decimal" step="${step}" data-k="${k}" value="${S.inputs[k]}"></label>`;
const out = (label, value, sub, detail, neg) =>
  `<div class="out${neg ? " neg" : ""}"><div class="lab">${label}</div><div class="v">${value}</div><div class="s">${sub}</div>${detail ? `<div class="d">${detail}</div>` : ""}</div>`;

const pnum = (k, label, step = 1) => `<label class="f"><span>${label}</span><input type="number" inputmode="decimal" step="${step}" data-p="${k}" value="${S.plan[k]}"></label>`;
function renderPlan() {
  const P = S.plan, d = dinero(), r = reparto(1000), ok = r.suma === 100, fecha = (x) => x.split("-").reverse().join("/");
  const ult = (window.FUNDING?.contexto?.().ultimosMovimientos || []).find((m) => m.tipo === "retirada");
  const ej = ult ? reparto(Math.abs(ult.importe)) : r;
  return `
  <div class="sec"><b>05</b><span>Plan de dinero · reparto de cada payout</span></div>
  <div class="two"><div class="card"><div class="fields">${pnum("pctCapital", "A capital propio (%)")}${pnum("pctExamenes", "A más exámenes (%)")}${pnum("pctTuyo", "Para ti (%)")}${pnum("pctImpuestos", "Apartado para Hacienda (%)")}
      ${pnum("cambio", "Cambio: 1 $ = … €", 0.01)}</div>
      <div style="font-size:11.5px;color:${ok ? "var(--faint)" : "var(--coral)"};margin-top:10px">${ok ? "Suman 100 %." : "Ojo: suman " + r.suma + " %, tienen que sumar 100 %."} Lo de Hacienda depende de tu caso: confírmalo con un asesor.</div></div>
    <div class="outs">${out(ult ? "TU ÚLTIMO PAYOUT · " + ej.usd.toLocaleString("es-ES") + " $" : "EJEMPLO · PAYOUT DE 1.000 $", eur(ej.capitalEur).replace(/^\+/, ""), "a capital propio (" + ej.capitalUsd.toLocaleString("es-ES") + " $)",
        ej.examenes.toLocaleString("es-ES") + " $ a exámenes · " + ej.tuyo.toLocaleString("es-ES") + " $ para ti · " + ej.impuestos.toLocaleString("es-ES") + " $ para Hacienda")}</div></div>

  <div class="sec"><b>06</b><span>Retiros de capital propio</span></div>
  <div class="two"><div class="card"><div class="fields">
      <label class="f"><span>Cada cuánto retiras</span><select data-p="frecuencia" style="width:100%;background:var(--raised);border:1px solid var(--borderLight);border-radius:7px;padding:9px 10px;color:var(--text);font-size:14px">
        <option value="semanal" ${P.frecuencia === "semanal" ? "selected" : ""}>Semanal (los viernes)</option><option value="mensual" ${P.frecuencia === "mensual" ? "selected" : ""}>Mensual (último día)</option></select></label>
      ${pnum("pctRetiro", "% del beneficio que retiras")}</div>
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">Solo se retira beneficio: nunca por debajo de lo que has metido (${eur(d.aportado).replace(/^\+/, "")}).</div></div>
    <div class="outs">${out(d.hoyToca ? "HOY TOCA RETIRO" : "PRÓXIMO RETIRO · " + fecha(d.periodo.dia), eur(d.sugerido).replace(/^\+/, ""), "beneficio de " + d.periodo.nombre + ": " + eur(d.beneficio) + (d.retirado ? " · ya retirado " + eur(d.retirado).replace(/^\+/, "") : ""),
        d.sugerido > 0 ? "El " + P.pctRetiro + " % de lo ganado " + d.periodo.nombre + "." : "Sin beneficio que retirar " + d.periodo.nombre + ".", d.beneficio < 0)}
      <div class="btns"><input id="cp-ret" type="number" inputmode="decimal" placeholder="€" value="${Math.round(d.sugerido) || ""}" style="width:110px;background:var(--raised);border:1px solid var(--borderLight);border-radius:10px;padding:10px;color:var(--text)">
        <button class="loss" type="button" data-act="retiro">Registrar retiro</button></div></div></div>

  <div class="sec"><b>07</b><span>Cuándo meter más capital</span></div>
  <div class="two"><div class="card"><div class="fields">${pnum("esperaSiCae", "Espera si estás más de … % por debajo de tu máximo")}</div>
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">Lo que metes sale de tu reparto de payouts (${P.pctCapital} %). No se mete dinero en mitad de una mala racha.</div></div>
    <div class="outs"><div class="shield${d.puedeAportar ? "" : " bad"}"><span style="font-size:20px">${d.puedeAportar ? "✅" : "⏸️"}</span><div><b>${d.puedeAportar ? "Puedes aportar" : "Espera para aportar"}</b>
        <small>${d.puedeAportar ? "Estás a un " + pct(d.caida) + " de tu máximo (" + eur(d.pico).replace(/^\+/, "") + ")." : "Estás un " + pct(d.caida) + " por debajo de tu máximo: guarda la parte de capital propio hasta que te recuperes."}</small></div></div>
      <div class="btns"><input id="cp-apo" type="number" inputmode="decimal" placeholder="€" style="width:110px;background:var(--raised);border:1px solid var(--borderLight);border-radius:10px;padding:10px;color:var(--text)">
        <button class="win" type="button" data-act="aporte">Registrar aporte</button></div></div></div>

  <div class="sec"><b>08</b><span>Subir el riesgo cuando la cuenta crece</span></div>
  <div class="two"><div class="card"><div class="fields">${pnum("riesgoBase", "Riesgo base (%)", 0.1)}${pnum("cadaPct", "Sube cada +… % de crecimiento")}${pnum("subePuntos", "Cuánto sube (puntos %)", 0.1)}
      ${pnum("riesgoMax", "Riesgo máximo (%)", 0.1)}${pnum("bajaSiCae", "Baja un escalón si cae … % del máximo")}</div>
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">Lo que metes no cuenta como crecimiento: solo cuenta lo que ganas sobre lo que has metido. Nunca pasa del riesgo que aguanta tu racha (${pct(d.tope, 2)}).</div></div>
    <div class="outs">${out("RIESGO QUE TOCA", pct(d.recomendado, 2), "escalón " + d.escalon + " · cuenta " + (d.crec >= 0 ? "+" : "") + pct(d.crec) + " sobre lo aportado",
        "Siguiente escalón con " + eur(d.siguiente).replace(/^\+/, "") + ". Ahora usas " + pct(S.inputs.riesgoPct) + ".", d.recomendado < S.inputs.riesgoPct)}
      ${Math.abs(d.recomendado - S.inputs.riesgoPct) > 0.001 ? `<div class="btns"><button class="win" type="button" data-act="aplicar-riesgo">Usar ${pct(d.recomendado, 2)}</button></div>` : ""}</div></div>`;
}
function renderPropuesta() {
  const p = recomendar(), P = S.plan, I = S.inputs, row = (l, a, b) => `<div class="row${String(a) === String(b) ? "" : " l"}"><span>${l}</span><b>${a} → ${b}</b></div>`;
  return `
  <div class="sec"><b>09</b><span>Que Jarvis te proponga el plan</span></div>
  <div class="note">Con tus datos de arriba (saldo inicial, winrate, ratio, operaciones al día, racha y pérdida máxima) Jarvis calcula el riesgo y el plan que encajan. ${p.porque}
    ${p.sinVentaja ? "" : " Con ese riesgo, un día normal da de media unos " + eur(p.gananciaDia).replace(/^\+/, "") + " al principio."} Es una cuenta, no una promesa: revísala con tu historial real.</div>
  <div class="card">${row("Riesgo por operación", pct(I.riesgoPct, 2), pct(p.riesgo, 2))}${row("Stops máximos al día", I.stopsMaxDia, p.stops)}
    ${row("Escalones de riesgo", P.riesgoBase + " % · +" + P.subePuntos + " cada " + P.cadaPct + " % · máx " + P.riesgoMax + " %", p.plan.riesgoBase + " % · +" + p.plan.subePuntos + " cada " + p.plan.cadaPct + " % · máx " + p.plan.riesgoMax + " %")}
    ${row("Bajar escalón / esperar para aportar si cae", P.bajaSiCae + " % / " + P.esperaSiCae + " %", p.plan.bajaSiCae + " % / " + p.plan.esperaSiCae + " %")}
    ${row("Retiros", P.frecuencia + " · " + P.pctRetiro + " %", p.plan.frecuencia + " · " + p.plan.pctRetiro + " %")}
    <button class="win" type="button" data-act="aplicar-propuesta" style="margin-top:12px">Aplicar la propuesta</button>
    <div style="font-size:11.5px;color:var(--faint);margin-top:8px">El reparto de los payouts no se toca: eso lo decides tú.</div></div>`;
}
function render() {
  const I = S.inputs, s = saldo(), c = calc(), up = s >= I.saldoInicial;
  $("#cp-view").innerHTML = `
  <div class="kick">CAMINOALMILLONFX · CAPITAL PROPIO</div>
  <h1>${pct(I.riesgoPct)} compuesto</h1>
  <div class="lede">Siempre sobre el saldo de hoy. Si ganas, sube. Si pierdes, baja. Máximo ${I.stopsMaxDia} stops al día.</div>
  <div class="hero"><div><div class="lab">SALDO ACTUAL</div><div class="big">${eur(s).replace(/^\+/, "")}</div>
      <div style="font-size:13px;margin-top:4px;color:${up ? "var(--accent)" : "var(--coral)"}">${up ? "+" : ""}${pct((s / I.saldoInicial - 1) * 100)} desde tu inicio de ${eur(I.saldoInicial).replace(/^\+/, "")}</div></div>
    <div class="btns"><button class="win" type="button" data-act="win">↗ Registrar Win</button><button class="loss" type="button" data-act="loss">↘ Registrar Loss</button></div></div>

  <div class="sec"><b>01</b><span>Esto ya no es una fondeada</span></div>
  <div class="cmp">
    <div class="card"><h3>Cuenta fondeada</h3>${["Un EOD te echa a los 4 stops", "Si la quemas, repones por dinero", "Reglas puestas por otro", "Riesgo bajo obligado: 1–1,5%"].map((t) => `<div class="item"><i>→</i>${t}</div>`).join("")}<div class="foot">El límite te lo pone la prop firm</div></div>
    <div class="card acc"><h3>Capital propio</h3>${["Nadie te saca. Nunca", "Si lo quemas, no hay reposición", "Las reglas las pones tú y no hay quien te vigile", `Riesgo alto posible: ${pct(I.riesgoPct)} compuesto`].map((t) => `<div class="item"><i>→</i>${t}</div>`).join("")}<div class="foot">El límite eres tú</div></div>
  </div>
  <div class="note">En fondeo, el peor escenario es perder una cuota y volver a empezar. Aquí, el peor escenario es quedarte sin negocio. Por eso el riesgo no es fijo: es un porcentaje del saldo de hoy.</div>

  <div class="sec"><b>02</b><span>Tu número de hoy</span></div>
  <div class="two"><div class="card"><div class="lab" style="color:var(--faint)">TUS DATOS</div><div class="fields">
      ${num("stopsMaxDia", "Stops máx. por día")}${num("winrate", "Winrate (%)")}${num("riesgoPct", "Riesgo por operación (%)", { step: 0.1, hi: true })}
      ${num("ratioTpSl", "Ratio TP:SL", { step: 0.01 })}${num("opsPorDia", "Operaciones por día")}${num("saldoInicial", "Saldo inicial (€)")}</div></div>
    <div class="outs">${out("ARRIESGAS HOY", eur(c.arriesgasHoy).replace(/^\+/, ""), `objetivo ${eur(c.objetivoGanancia).replace(/^\+/, "")} · ratio x${I.ratioTpSl}`, `Arriesgas ${pct(I.riesgoPct)} de lo que tienes hoy`)}
      ${out("SI PIERDES TODOS TUS STOPS HOY", "-" + eur(c.dineroDrawdownDiario).replace(/^\+/, ""), pct(-c.drawdownDiario * 100), `${I.stopsMaxDia} pérdidas seguidas al ${pct(I.riesgoPct)}, compuesto dentro del día`, true)}</div></div>

  <div class="sec"><b>03</b><span>¿Aguanta tu riesgo tu peor racha?</span></div>
  <div style="font-size:12.5px;color:var(--faint);margin:-6px 0 14px">Aquí no hay EOD. El límite lo pones tú.</div>
  <div class="two"><div class="card"><div class="fields">${num("rachaMaxima", "Tu racha máxima (stops seguidos en tu historial real)", { full: true })}
      ${num("maxPerdidaAceptada", "Máximo que aceptas perder (%)")}${num("margenSeguridad", "Margen de seguridad (x)")}</div>
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">${I.rachaMaxima} × ${I.margenSeguridad} = ${c.margenSeguro} stops de margen exigido</div></div>
    <div class="outs">${out("RIESGO QUE DICE TU RACHA", pct(c.riesgoQueDiceTuRacha, 2), `${eur(c.dineroDeEseRiesgo).replace(/^\+/, "")} con el saldo de hoy`, "Riesgo máximo/operación para que tu peor racha × margen no supere tu límite")}
      <div class="shield${c.esSeguro ? "" : " bad"}"><span style="font-size:20px">${c.esSeguro ? "🛡️" : "⚠️"}</span><div><b>${c.esSeguro ? "Tu riesgo actual aguanta el margen" : "Tu riesgo actual no aguanta el margen"}</b>
        <small>Al ${pct(I.riesgoPct)}, llegarías a tu límite en ~${Number.isFinite(c.stopsHastaLimite) ? c.stopsHastaLimite.toFixed(1) : "∞"} stops seguidos${c.esSeguro ? " — por encima del margen exigido." : " — por debajo del margen exigido. Baja el riesgo."}</small></div></div></div></div>

  <div class="sec"><b>04</b><span>Registro de hoy y días anteriores</span></div>
  <div class="card">${S.log.length ? [...S.log].reverse().map((e) => `<div class="row${e.resultado === "win" || e.resultado === "aporte" ? "" : " l"}"><span>${({ win: "✓", loss: "✗", aporte: "➕", retiro: "➖" })[e.resultado]}&nbsp; ${e.date} · ${isTrade(e) ? "riesgo " + pct(e.riesgoPct) : (e.resultado === "aporte" ? "aporte " : "retiro ") + eur(e.importe).replace(/^\+/, "")}</span><b>${eur(e.balanceAfter).replace(/^\+/, "")}</b></div>`).join("")
    : '<div class="empty">Sin registros todavía — usa "Registrar Win" o "Registrar Loss" arriba para empezar a componer tu saldo.</div>'}
    ${S.log.length ? '<button class="ghost" type="button" data-act="undo">🗑 Deshacer último registro</button>' : ""}</div>
  ${renderPlan()}
  ${renderPropuesta()}
  <button class="ghost reset" type="button" data-act="reset">Reiniciar todo (volver a ${eur(DEF.saldoInicial).replace(/^\+/, "")})</button>`;
}

function toast(t) { const el = $("#cp-toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2200); }
// One write per change, a moment after the last keystroke.
function save() {
  clearTimeout(S.saveT);
  S.saveT = setTimeout(async () => {
    try { if (S.db) await S.db.doc("fm/capital").set({ inputs: S.inputs, plan: S.plan, log: S.log, actualizado: new Date().toISOString() }); }
    catch { toast("No se ha podido guardar."); }
  }, 600);
}
function registrar(resultado) {
  const r = S.inputs.riesgoPct / 100, before = saldo();
  const after = resultado === "win" ? before * (1 + r * S.inputs.ratioTpSl) : before * (1 - r);
  S.log.push({ id: Date.now().toString(), date: today(), resultado, riesgoPct: S.inputs.riesgoPct, balanceBefore: before, balanceAfter: after });
  render(); save(); toast(resultado === "win" ? "Win registrado." : "Loss registrado.");
}
$("#cp").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "win" || a === "loss") return registrar(a);
  if (a === "aporte" || a === "retiro") {
    const v = Math.abs(Number($(a === "aporte" ? "#cp-apo" : "#cp-ret").value) || 0); if (!v) return toast("Pon el importe en euros.");
    const before = saldo(); if (a === "retiro" && v > before) return toast("No puedes retirar más de lo que hay.");
    S.log.push({ id: Date.now().toString(), date: today(), resultado: a, importe: v, riesgoPct: S.inputs.riesgoPct, balanceBefore: before, balanceAfter: a === "aporte" ? before + v : before - v });
    render(); save(); return toast(a === "aporte" ? "Aporte registrado." : "Retiro registrado.");
  }
  if (a === "aplicar-propuesta") { if (!confirm("¿Aplicar el riesgo y el plan propuestos?")) return; aplicarPropuesta(recomendar()); return toast("Propuesta aplicada."); }
  if (a === "aplicar-riesgo") { S.inputs.riesgoPct = dinero().recomendado; render(); save(); return toast("Riesgo actualizado."); }
  if (a === "undo") { S.log.pop(); render(); save(); return; }
  if (a === "reset") { if (!confirm("¿Reiniciar todo? Se borran tus datos y tu registro.")) return; S.inputs = { ...DEF }; S.log = []; render(); save(); }
});
$("#cp").addEventListener("change", (e) => {
  const p = e.target.dataset.p;
  if (p) { S.plan[p] = p === "frecuencia" ? e.target.value : Number(e.target.value); if (p !== "frecuencia" && !Number.isFinite(S.plan[p])) S.plan[p] = PLAN_DEF[p]; render(); save(); return; }
  const k = e.target.dataset.k; if (!k) return;
  const v = Number(e.target.value); if (!Number.isFinite(v)) return;
  S.inputs[k] = v; render(); save();
});

// What Jarvis reads when Joel asks about his own capital.
function contexto() {
  const c = calc(), I = S.inputs, s = saldo(), hoy = today(), deHoy = S.log.filter((e) => e.date === hoy);
  return { moneda: "EUR", saldoActual: Math.round(s * 100) / 100, saldoInicial: I.saldoInicial, rentabilidadDesdeInicio: pct((s / I.saldoInicial - 1) * 100),
    riesgoPorOperacion: I.riesgoPct + "%", arriesgasHoy: Math.round(c.arriesgasHoy * 100) / 100, objetivoPorOperacion: Math.round(c.objetivoGanancia * 100) / 100,
    ratioTpSl: I.ratioTpSl, winrate: I.winrate + "%", stopsMaxDia: I.stopsMaxDia, stopsHoy: deHoy.filter((e) => e.resultado === "loss").length,
    winsHoy: deHoy.filter((e) => e.resultado === "win").length, siPierdesTodosLosStopsHoy: -Math.round(c.dineroDrawdownDiario * 100) / 100,
    riesgoQueDiceTuRacha: pct(c.riesgoQueDiceTuRacha, 2), riesgoAguantaElMargen: c.esSeguro, stopsHastaElLimite: Number.isFinite(c.stopsHastaLimite) ? Math.round(c.stopsHastaLimite * 10) / 10 : null,
    ultimosRegistros: S.log.slice(-10).map((e) => ({ fecha: e.date, resultado: e.resultado, importe: e.importe, saldo: Math.round(e.balanceAfter * 100) / 100 })),
    planDeDinero: planDeDinero(), propuestaDeJarvis: (({ inputs, ...p }) => p)(recomendar()) };
}
function planDeDinero() {
  const P = S.plan, d = dinero(), r2 = (n) => Math.round(n * 100) / 100, ej = reparto(1000);
  return { repartoDeCadaPayout: { aCapitalPropio: P.pctCapital + "%", aMasExamenes: P.pctExamenes + "%", paraJoel: P.pctTuyo + "%", paraHacienda: P.pctImpuestos + "%", cambioUsdEur: P.cambio,
             ejemploPayout1000: { capitalPropioUsd: ej.capitalUsd, capitalPropioEur: ej.capitalEur, examenes: ej.examenes, paraJoel: ej.tuyo, hacienda: ej.impuestos } },
    retiros: { frecuencia: P.frecuencia === "semanal" ? "semanal, los viernes" : "mensual, el último día del mes", porcentajeDelBeneficio: P.pctRetiro + "%",
               beneficioDelPeriodo: r2(d.beneficio), yaRetirado: r2(d.retirado), retiroQueToca: r2(d.sugerido), proximoRetiro: d.periodo.dia, hoyToca: d.hoyToca, nuncaPorDebajoDe: r2(d.aportado) },
    aportes: { puedeAportarAhora: d.puedeAportar, caidaDesdeMaximo: r2(d.caida) + "%", esperaSiCaeMasDe: P.esperaSiCae + "%", saleDe: P.pctCapital + "% de cada payout" },
    riesgo: { actual: S.inputs.riesgoPct + "%", queToca: d.recomendado + "%", escalon: d.escalon, crecimientoSobreLoAportado: r2(d.crec) + "%", siguienteEscalonConSaldo: r2(d.siguiente),
              reglas: "base " + P.riesgoBase + "%, +" + P.subePuntos + " puntos cada +" + P.cadaPct + "% de crecimiento, máximo " + P.riesgoMax + "% (y nunca más que el riesgo que aguanta su racha, " + r2(d.tope) + "%), baja un escalón si cae un " + P.bajaSiCae + "% desde el máximo" } };
}
window.CAPITAL = { contexto, render, textoReparto, dinero, recomendar, aplicarPropuesta };

(async () => {
  render();
  const db = window.claude?.use ? await window.claude.use("db") : null;
  S.db = db; if (!db) return;
  db.doc("fm/capital").onSnapshot((snap) => {
    if (!snap.exists) return;
    const d = snap.data();
    const focused = ROOT.activeElement && ROOT.activeElement.dataset && (ROOT.activeElement.dataset.k || ROOT.activeElement.dataset.p);
    S.inputs = { ...DEF, ...(d.inputs || {}) }; S.plan = { ...PLAN_DEF, ...(d.plan || {}) }; S.log = Array.isArray(d.log) ? d.log : [];
    if (!focused) render();
  }, () => {});
})();
})();
</script>
