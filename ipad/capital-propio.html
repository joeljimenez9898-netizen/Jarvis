<title>Capital propio</title>
<style>

            margin: 28px 0; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; }

.cp .pz.h { box-shadow: inset 3px 0 0 var(--coral); } .cp .pz.x { box-shadow: inset 3px 0 0 #e8b04a; } .cp .pz.c { box-shadow: inset 3px 0 0 var(--accent); } .cp .pz.t { box-shadow: inset 3px 0 0 #7aa7ff; }
.cp .escalera td:first-child { white-space: nowrap; }
.cp .prueba { display: block; margin-bottom: 12px; max-width: 320px; }
.cp .prueba input { width: 100%; background: var(--raised); border: 1px solid var(--accent); border-radius: 7px; padding: 9px 10px; color: var(--text); font-size: 14px; }
.cp .tablawrap { overflow-x: auto; }

@media (max-width: 640px) { .cp .opera .fields { grid-template-columns: 1fr 1fr; } }
.cp .opera .prev { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
.cp .opera .prev span { background: var(--raised); border-radius: 8px; padding: 8px 12px; color: var(--muted); }
.cp .opera .prev b.w { color: var(--accent); } .cp .opera .prev b.l { color: var(--coral); }
</style>
<div class="cp" id="cp">
  <div class="wrap">
    <button id="cp-back" type="button" hidden>← Galaxia</button>
    <div id="cp-view"></div>
  </div>
  <div class="toast" id="cp-toast" hidden></div>
</div>
<script>
(() => {
"use strict";
// Capital propio: 4.5 % compounded on today's balance. Saved in the artifact's database (fm/capital).
const ROOT = window.__CAP_ROOT || document;
const $ = (s) => ROOT.querySelector(s);
const DEF = { saldoInicial: 1000, stopsMaxDia: 2, winrate: 82, riesgoPct: 4.5, ratioTpSl: 0.31, opsPorDia: 4, rachaMaxima: 3, maxPerdidaAceptada: 30, margenSeguridad: 2 };
// Joel's money rules: how each funded payout is split, when and how much to take out of his own capital,
// when to add to it, and how risk climbs as the account grows. Starting values; he sets his own.
const PLAN_DEF = { pctCapital: 30, pctExamenes: 20, pctTuyo: 30, pctImpuestos: 20, cambio: 0.92,
                   frecuencia: "mensual", pctRetiro: 30, objetivoRetiroPct: 10, esperaSiCae: 10, aporteCadaPct: 20,
                   riesgoBase: 4.5, cadaPct: 25, subePuntos: 0.5, riesgoMax: 6, bajaSiCae: 10,
                   repartoAuto: true, metaCapital: 10000, mesesExamenes: 2, otrosIngresos: 0, topeExamenes: 40, topeCapital: 50 };
const S = { inputs: { ...DEF }, plan: { ...PLAN_DEF }, log: [], db: null, saveT: null, tocado: 0, op: { eur: null, res: "" } };
const eur = (n) => { const v = Number(n || 0); return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toLocaleString("es-ES", { maximumFractionDigits: 0 }) + " €"; };
const pct = (n, d = 1) => `${Number(n || 0).toFixed(d)}%`;
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const saldo = () => (S.log.length ? S.log[S.log.length - 1].balanceAfter : S.inputs.saldoInicial);

// ── plan de dinero ─────────────────────────────────────────────
const isTrade = (e) => e.resultado === "win" || e.resultado === "loss";
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function repartoFijo(usd) {
  const P = S.plan, x = Math.abs(Number(usd) || 0), part = (p) => Math.round(x * p) / 100;
  return { usd: x, capitalUsd: part(P.pctCapital), capitalEur: Math.round(part(P.pctCapital) * P.cambio * 100) / 100, examenes: part(P.pctExamenes), tuyo: part(P.pctTuyo),
           impuestos: part(P.pctImpuestos), suma: P.pctCapital + P.pctExamenes + P.pctTuyo + P.pctImpuestos };
}
function textoRepartoFijo(usd) {
  const r = repartoFijo(usd), $ = (n) => n.toLocaleString("es-ES", { maximumFractionDigits: 2 }) + " $";
  return "Según su plan de dinero, de esos " + $(r.usd) + ": " + $(r.capitalUsd) + " a capital propio (unos " + Math.round(r.capitalEur) + " €), " + $(r.examenes) +
    " para más exámenes, " + $(r.tuyo) + " para usted y " + $(r.impuestos) + " apartados para Hacienda.";
}
// The withdrawal period that holds "ref": a week (Monday to Sunday) or a month. Withdrawals happen at its close,
// on "dia" (Friday, or the month's last weekday), on the whole period's result, never in the middle of it.
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
function periodo(ref = new Date(), pasado = false) {
  const now = new Date(ref), P = S.plan, cuando = (d) => "el " + DIAS[d.getDay()] + " " + d.getDate();
  if (P.frecuencia === "semanal") {
    const lunes = new Date(now); lunes.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    const viernes = new Date(lunes); viernes.setDate(lunes.getDate() + 4);
    const domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
    return { desde: iso(lunes), hasta: iso(domingo), dia: iso(viernes), nombre: pasado ? "la semana pasada" : "esta semana", fin: "la semana", cuando: cuando(viernes), gracia: 2 };
  }
  const fin = new Date(now.getFullYear(), now.getMonth() + 1, 0), ult = new Date(fin);
  while (ult.getDay() === 0 || ult.getDay() === 6) ult.setDate(ult.getDate() - 1);
  return { desde: iso(new Date(now.getFullYear(), now.getMonth(), 1)), hasta: iso(fin), dia: iso(ult), nombre: pasado ? "el mes pasado" : "este mes", fin: "el mes", cuando: cuando(ult), gracia: 7 };
}
// One period's result: profit from trades inside it, and what has already been withdrawn for it.
function cierre(per, s, aportado) {
  const P = S.plan, dentro = (e) => e.date >= per.desde && e.date <= per.hasta;
  const antes = S.log.filter((e) => e.date < per.desde).pop(), en = S.log.filter(dentro);
  const inicio = antes ? antes.balanceAfter : en.length ? en[0].balanceBefore : s;
  const beneficio = en.filter(isTrade).reduce((a, e) => a + (e.balanceAfter - e.balanceBefore), 0);
  const retirado = S.log.filter((e) => e.resultado === "retiro" && (e.periodo ? e.periodo === per.desde : dentro(e))).reduce((a, e) => a + e.importe, 0);
  const objetivo = inicio * P.objetivoRetiroPct / 100;
  const sugerido = Math.max(0, Math.min(beneficio * P.pctRetiro / 100 - retirado, s - aportado));
  return { per, inicio, beneficio, retirado, objetivo, sugerido, alcanza: beneficio >= objetivo && beneficio > 0 };
}
// Euros as Jarvis says them aloud, and how many take-profits in a row reach a balance.
const euros = (n) => Math.round(Math.abs(n)).toLocaleString("es-ES", { useGrouping: "always" }) + " euros";
const tpTxt = (n) => (!Number.isFinite(n) ? "—" : n <= 1 ? "1 TP" : "unos " + n + " TP");
function tpsHasta(meta) {
  const s = saldo(), g = 1 + (S.inputs.riesgoPct / 100) * S.inputs.ratioTpSl;
  return meta <= s ? 0 : g > 1 ? Math.ceil(Math.log(meta / s) / Math.log(g) - 1e-9) : Infinity;
}
// A withdrawal from own capital is shared out like a payout, minus the part that would go straight back into it.
function repartoRetiroFijo(eurosRetiro) {
  const P = S.plan, resto = P.pctExamenes + P.pctTuyo + P.pctImpuestos || 1, x = Math.abs(eurosRetiro);
  const part = (p) => Math.round((x * p) / resto * 100) / 100;
  return { total: x, examenes: part(P.pctExamenes), tuyo: part(P.pctTuyo), impuestos: part(P.pctImpuestos) };
}
function textoRepartoRetiro(eurosRetiro, id) {
  const r = repartoRetiro(eurosRetiro, id);
  return "Repártalo así: " + euros(r.impuestos) + " para Hacienda, " + euros(r.examenes) + " para más exámenes y " + euros(r.tuyo) + " para usted.";
}
// ── Jarvis manages the split. Every payout and own-capital withdrawal, in date order, is shared out by four rules:
// 1. Hacienda: what that money adds to this year's IRPF (general scale for payouts, minus exam costs, which are expenses;
//    savings scale for own-capital gains). An estimate to set aside, not a tax return.
// 2. Exams: whatever refills the exams fund to "mesesExamenes" months of his real exam spending (last 90 days), at most topeExamenes % of what's left.
// 3. Own capital (payouts only): towards "metaCapital", at most topeCapital % of what's left after exams.
// 4. The rest is his.
const TRAMOS_GENERAL = [[12450, 19], [20200, 24], [35200, 30], [60000, 37], [300000, 45], [Infinity, 47]];
const TRAMOS_AHORRO = [[6000, 19], [50000, 21], [200000, 23], [300000, 27], [Infinity, 28]];
function cuota(base, tramos) { let t = 0, ant = 0; for (const [hasta, p] of tramos) { if (base <= ant) break; t += (Math.min(base, hasta) - ant) * p / 100; ant = hasta; } return t; }
const tramoDe = (base, tramos) => (tramos.find(([hasta]) => base < hasta) || tramos[tramos.length - 1])[1];
const menos90 = (f) => { const d = new Date((f || today()) + "T12:00:00"); d.setDate(d.getDate() - 90); return iso(d); };
function gestion(extraUsd) {
  const P = S.plan, F = window.FUNDING || {}, cambio = P.cambio || 1, r2 = (n) => Math.round(n * 100) / 100, suma = (l) => l.reduce((a, m) => a + m.importe, 0);
  const pagos = (F.payouts ? F.payouts() : []).map((m) => ({ ...m, clase: "payout" }));
  if (extraUsd) pagos.push({ id: "nuevo", fecha: today(), empresa: "", importe: Math.abs(extraUsd), clase: "payout" });
  const costes = F.costes ? F.costes() : [], aportes = S.log.filter((e) => e.resultado === "aporte");
  const retiros = S.log.filter((e) => e.resultado === "retiro").map((e) => ({ id: e.id, fecha: e.date, importe: e.importe, clase: "retiro" }));
  const eventos = [...pagos, ...retiros].sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
  // the exams fund in $ runs on its own: payouts fill it, exam costs empty it, and it never goes below zero
  // (exams paid before there was any fund came out of his pocket, they aren't owed back to it)
  const filas = new Map(); let hucha = 0, desdeF = "", capAsignado = 0;
  const gastar = (hastaF) => { hucha = Math.max(0, hucha - suma(costes.filter((c) => c.fecha > desdeF && c.fecha <= hastaF))); desdeF = hastaF; };
  for (const ev of eventos) {
    const anio = (ev.fecha || "").slice(0, 4), hasta = (l) => l.filter((m) => (m.fecha || "") <= ev.fecha);
    const gastoMes = suma(costes.filter((c) => c.fecha <= ev.fecha && c.fecha > menos90(ev.fecha))) / 3;
    gastar(ev.fecha || ""); const objetivo = gastoMes * P.mesesExamenes;
    const total = ev.clase === "payout" ? ev.importe * cambio : ev.importe, porque = [];
    let hac;
    if (ev.clase === "payout") {
      const antes = suma([...filas.values()].filter((x) => x.clase === "payout" && x.fecha.slice(0, 4) === anio).map((x) => ({ importe: x.eur })));
      const gastosAnio = suma(hasta(costes).filter((c) => c.fecha.slice(0, 4) === anio)) * cambio;
      const base = (P.otrosIngresos || 0) + antes - gastosAnio;
      hac = cuota(Math.max(0, base + total), TRAMOS_GENERAL) - cuota(Math.max(0, base), TRAMOS_GENERAL);
      porque.push("Hacienda: lo que este payout suma a tu IRPF del " + anio + " (llevas " + euros(Math.max(0, base)) + " de base, tramo del " + tramoDe(Math.max(0, base + total), TRAMOS_GENERAL) + " %).");
    } else {
      const antes = suma([...filas.values()].filter((x) => x.clase === "retiro" && x.fecha.slice(0, 4) === anio).map((x) => ({ importe: x.eur })));
      hac = cuota(antes + total, TRAMOS_AHORRO) - cuota(antes, TRAMOS_AHORRO);
      porque.push("Hacienda: ganancia de capital propio, escala del ahorro (" + tramoDe(antes + total, TRAMOS_AHORRO) + " %).");
    }
    const resto = total - hac;
    let ex;
    if (gastoMes > 0) {
      ex = Math.min(Math.max(0, objetivo - hucha) * cambio, resto * P.topeExamenes / 100);
      porque.push(ex > 0 ? "Exámenes: rellena la hucha hasta " + P.mesesExamenes + " meses de tu gasto real (" + Math.round(gastoMes) + " $ al mes); tenías " + Math.round(Math.max(0, hucha)) + " $."
        : "Exámenes: nada, la hucha ya cubre " + P.mesesExamenes + " meses de exámenes.");
    } else {
      ex = resto * Math.min(P.pctExamenes, P.topeExamenes) / 100;
      porque.push("Exámenes: aún no hay costes de examen apuntados en el Funding Manager, así que aparta el " + Math.min(P.pctExamenes, P.topeExamenes) + " %.");
    }
    hucha += ex / cambio;
    let cap = 0;
    if (ev.clase === "payout") {
      const metido = S.inputs.saldoInicial + suma(hasta(aportes.map((e) => ({ fecha: e.date, importe: e.importe }))));
      const tiene = metido + Math.max(0, capAsignado - suma(hasta(aportes.map((e) => ({ fecha: e.date, importe: e.importe })))));
      cap = Math.min(Math.max(0, P.metaCapital - tiene), (resto - ex) * P.topeCapital / 100);
      capAsignado += cap;
      porque.push(cap > 0 ? "Capital propio: hacia tu meta de " + euros(P.metaCapital) + " (llevas " + euros(tiene) + ")." : "Capital propio: nada, ya llegas a tu meta de " + euros(P.metaCapital) + ".");
    }
    const tuyo = resto - ex - cap;
    porque.push("Para ti: lo que queda.");
    filas.set(ev.clase + ":" + ev.id, { clase: ev.clase, id: ev.id, fecha: ev.fecha || "", empresa: ev.empresa || "", usd: ev.clase === "payout" ? ev.importe : null, eur: r2(total),
      hacienda: r2(hac), examenes: r2(ex), capital: r2(cap), tuyo: r2(tuyo), porque });
  }

function toast(t) { const el = $("#cp-toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2200); }
// One write per change, a moment after the last keystroke.
function save() {
  S.tocado = Date.now();
  clearTimeout(S.saveT);
  S.saveT = setTimeout(async () => {
    try { if (S.db) await S.db.doc("fm/capital").set({ inputs: S.inputs, plan: S.plan, log: S.log, actualizado: new Date().toISOString() }); }
    catch (err) { toast("No se ha podido guardar: " + (err && err.message || "error") + "."); }
  }, 600);
}
// After each tap Jarvis says where the account stands (a tap is when the iPad lets a page speak).
function decir(t) { try { if (window.Voice && window.Voice.speak) { window.Voice.stopSpeaking && window.Voice.stopSpeaking(); window.Voice.speak(t); } } catch {} }
function avisoTrasRegistro(cabeza) {
  const d = dinero(), I = S.inputs, partes = [cabeza, "Saldo " + euros(saldo()) + "."];
  if (d.puedeRetirar) partes.push("Ya puede retirar " + euros(d.sugerido) + ".");
  if (d.puedeAportar) partes.push("Ya puede meter más capital.");

  partes.push(d.quema <= 1 ? "Cuidado: un stop más y llega a su pérdida máxima." : d.quema === 2 ? "Cuidado: con dos stops seguidos llega a su pérdida máxima." : "Si la siguiente es TP, sube a " + euros(d.saldoTp) + "; si es stop, baja a " + euros(d.saldoSl) + ".");

function registrar(resultado) {
  const before = saldo(), riesgo = riesgoOp(), importe = importeOp(resultado);
  if (resultado === "loss" && importe > before) return toast("Esa pérdida es mayor que tu saldo: revisa el importe.");
  const after = resultado === "win" ? before + importe : before - importe;
  S.log.push({ id: Date.now().toString(), date: today(), resultado, riesgoPct: Math.round(riesgo / before * 10000) / 100, riesgoEur: Math.round(riesgo * 100) / 100,
               importe: Math.round(importe * 100) / 100, manual: Number(String(S.op.res || "").replace(",", ".")) > 0, balanceBefore: before, balanceAfter: after });
  S.op = { eur: null, res: "" };                    // the next trade starts again from the plan's risk
  save(); render(); toast((resultado === "win" ? "Win de +" : "Loss de −") + euros(importe) + " registrado.");

  btn.dataset.txt = btn.textContent; btn.dataset.armado = "1"; btn.textContent = aviso || "¿Seguro? Toca otra vez";

// Buttons answer the finger itself (pointerup) as well as the click: inside a scrolling panel in Claude's
// iPhone/iPad frame the click doesn't always arrive. Whatever goes wrong shows on screen instead of failing silently.
let tocoEn = 0, desde = null;
$("#cp").addEventListener("pointerdown", (e) => { desde = { x: e.clientX, y: e.clientY }; });
$("#cp").addEventListener("pointerup", (e) => {
  if (e.pointerType === "mouse" || !desde || Math.hypot(e.clientX - desde.x, e.clientY - desde.y) > 12) return;
  const b = e.target.closest && e.target.closest("[data-act]"); if (!b) return;
  tocoEn = Date.now(); accion(b);

$("#cp").addEventListener("click", (e) => {

function hacer(b) {

    if (!v) { box.focus(); return toast("Escribe primero el importe en euros, en la casilla de al lado."); }
    const before = saldo(); if (a === "retiro" && v > before) return toast("No puedes retirar más de lo que hay.");
    const dn = dinero();
    S.log.push({ id: Date.now().toString(), date: today(), resultado: a, importe: v, riesgoPct: S.inputs.riesgoPct, balanceBefore: before, balanceAfter: a === "aporte" ? before + v : before - v,
                 ...(a === "retiro" ? { periodo: (dn.puedeRetirar ? dn.periodoRetiro : dn.periodo).desde } : {}) });

  if (a === "aplicar-riesgo") { S.inputs.riesgoPct = dinero().recomendado; render(); save(); return toast("Riesgo actualizado."); }
  if (a === "usar-retiro") { const r = recomendarRetiro(); S.plan.pctRetiro = r.pctRetiro; S.plan.frecuencia = r.frecuencia; S.plan.objetivoRetiroPct = r.objetivoRetiroPct; render(); save();

    repartoDeCadaPayout: { aCapitalPropio: P.pctCapital + "%", aMasExamenes: P.pctExamenes + "%", paraJoel: P.pctTuyo + "%", paraHacienda: P.pctImpuestos + "%", cambioUsdEur: P.cambio,
             ejemploPayout1000: { capitalPropioUsd: ej.capitalUsd, capitalPropioEur: ej.capitalEur, examenes: ej.examenes, paraJoel: ej.tuyo, hacienda: ej.impuestos } },
    retiros: { frecuencia: P.frecuencia, retiraCuandoGanaEnElPeriodo: P.objetivoRetiroPct + "%", porcentajeDelBeneficio: P.pctRetiro + "%",
               beneficioDelPeriodo: r2(d.beneficio), yaRetirado: r2(d.retirado), puedeRetirarYa: d.puedeRetirar, retiroDe: d.periodoRetiro.nombre, retiroEnCamino: d.enCamino, diaDeRetiro: d.periodo.cuando, retiroQueToca: r2(d.sugerido), faltaDeBeneficioParaRetirar: r2(d.faltaRetiro),
               tpsParaRetirar: Number.isFinite(d.tpsRetiro) ? d.tpsRetiro : null, nuncaPorDebajoDe: r2(d.aportado), repartoDelRetiro: repartoRetiro(d.sugerido),
               recomendacionJarvis: (({ porque, frecuencia, pctRetiro, objetivoRetiroPct }) => ({ frecuencia, pctRetiro: pctRetiro + "%", retirarCuandoElPeriodoGane: objetivoRetiroPct + "%", porque }))(recomendarRetiro()) },
    aportes: { puedeAportarYa: d.puedeAportar, aportaCadaVezQueCrece: P.aporteCadaPct + "%", faltaParaPoderAportar: r2(d.faltaAporte), tpsParaPoderAportar: Number.isFinite(d.tpsAporte) ? d.tpsAporte : null,
               caidaDesdeMaximo: r2(d.caida) + "%", esperaSiCaeMasDe: P.esperaSiCae + "%", saleDe: P.pctCapital + "% de cada payout" },
    payoutsDeFondeo: (window.FUNDING && window.FUNDING.payouts ? window.FUNDING.payouts() : []).slice(0, 6).map((m) => ({ fecha: m.fecha, empresa: m.empresa, usd: m.importe, reparto: S.plan.repartoAuto ? (gestion().filas.get("payout:" + m.id) || null) : repartoFijo(m.importe) })),
    riesgo: { actual: S.inputs.riesgoPct + "%", queToca: d.recomendado + "%", siguienteRiesgo: d.riesgoSiguiente + "%", faltaParaSubir: r2(Math.max(0, d.siguiente - saldo())), tpsParaSubir: Number.isFinite(d.tpsRiesgo) ? d.tpsRiesgo : null, escalon: d.escalon, crecimientoSobreLoAportado: r2(d.crec) + "%", siguienteEscalonConSaldo: r2(d.siguiente),

}
window.addEventListener("error", (ev) => { if (ROOT.host && !ROOT.host.hidden) toast("Algo ha fallado: " + (ev.message || "error") + ". Mándale una captura a Claude."); });
window.CAPITAL = { contexto, render, textoReparto, textoRepartoRetiro, dinero, comoVoy, recomendar, aplicarPropuesta };

(async () => {
  render();
  const db = window.claude?.use ? await window.claude.use("db") : null;
  S.db = db; if (!db) return;
  db.doc("fm/capital").onSnapshot((snap) => {
    if (!snap.exists) return;
    if (Date.now() - S.tocado < 4000) return;          // our own change is on its way: don't let an older copy undo it
    const d = snap.data();
    const focused = ROOT.activeElement && ROOT.activeElement.dataset && (ROOT.activeElement.dataset.k || ROOT.activeElement.dataset.p || ROOT.activeElement.dataset.op || ROOT.activeElement.dataset.sim || ROOT.activeElement.dataset.rsim);
    S.inputs = { ...DEF, ...(d.inputs || {}) }; S.plan = { ...PLAN_DEF, ...(d.plan || {}) }; S.log = Array.isArray(d.log) ? d.log.map((e) => ({ ...e })) : [];   // the database hands back frozen data: work on a copy
    if (!focused) render();
  }, () => {});
})();
})();
