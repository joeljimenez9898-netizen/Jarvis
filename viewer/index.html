<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Galaxy</title>
<style>
  :root {
    --bg: #000;
    --panel: rgba(10, 14, 24, 0.82);
    --line: rgba(140, 170, 255, 0.18);
    --text: #e6ecff;
    --muted: #8a96b8;
    --accent: #8ab4ff;
    --warn: #ffb86b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; }
  .glass { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

  #title { position: fixed; top: 18px; left: 20px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 13px; letter-spacing: .32em; font-weight: 600; color: var(--accent); }
  #title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  #legend { position: fixed; top: 70px; left: 20px; padding: 10px 14px; font-size: 12px; }
  #legend div { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 0; color: var(--muted); }
  #legend div:hover { color: var(--text); }
  #legend i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  #legend span.n { margin-left: auto; padding-left: 14px; opacity: .6; }

  #panel { position: fixed; top: 18px; right: 18px; bottom: 18px; width: min(380px, calc(100vw - 32px));
    padding: 20px 22px; overflow-y: auto; transform: translateX(calc(100% + 30px));
    transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  #panel.open { transform: none; }
  #panel .group { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
  #panel h2 { margin: 6px 0 12px; font-size: 22px; font-weight: 600; line-height: 1.2; }
  #panel .excerpt { color: #c8d1ee; white-space: pre-wrap; }
  #panel h3 { margin: 18px 0 8px; font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
  #close { position: absolute; top: 12px; right: 14px; background: none; border: 0; color: var(--muted);
    font-size: 22px; cursor: pointer; }
  #close:hover { color: var(--text); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--text);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .chip:hover { border-color: var(--accent); }
  .chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  #ask { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    width: min(760px, calc(100vw - 32px)); transition: left .45s cubic-bezier(.2,.8,.2,1); }
  /* keep the ask bar clear of the side panel on wide screens */
  @media (min-width: 900px) {
    body.panel-open #ask { left: calc((100vw - 400px) / 2); width: min(760px, calc(100vw - 440px)); }
  }
  #answer { display: none; margin-bottom: 10px; padding: 14px 18px; max-height: 38vh; overflow-y: auto; }
  #answer.show { display: block; }
  #answer .q { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #answer .a { font-size: 15px; }
  #answer.error .a { color: var(--warn); }
  #answer .chips { margin-top: 10px; }
  #answer.thinking .a::after { content: "▍"; animation: blink 1s steps(2) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  form { display: flex; gap: 8px; padding: 6px; }
  form input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
    font: inherit; font-size: 15px; padding: 10px 12px; }
  form input::placeholder { color: var(--muted); }
  form button { border: 0; border-radius: 10px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #07101f; }
  form button[type=button] { background: transparent; color: var(--muted); padding: 0 10px; font-weight: 400; }
  form button:disabled { opacity: .5; cursor: default; }
  #mic { display: grid; place-items: center; width: 42px; padding: 0; border-radius: 10px;
    background: rgba(255,255,255,.06); color: var(--text); }
  #mic svg { width: 18px; height: 18px; }
  #mic.on { background: #ff5d73; color: #fff; box-shadow: 0 0 0 0 rgba(255,93,115,.6); animation: pulse 1.4s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(255,93,115,0); } 100% { box-shadow: 0 0 0 0 rgba(255,93,115,0); } }
  #status { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; font-size: 12px; color: var(--muted);
    min-height: 18px; text-shadow: 0 1px 4px #000; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #56607a; flex: none; }
  #status[data-mode=listening] .dot { background: #ff5d73; box-shadow: 0 0 8px #ff5d73; }
  #status[data-mode=thinking] .dot { background: #ffc56e; box-shadow: 0 0 8px #ffc56e; animation: blink 1s steps(2) infinite; }
  #status[data-mode=speaking] .dot { background: #7ef0c4; box-shadow: 0 0 8px #7ef0c4; }
  #status[data-mode=listening] .label { color: var(--text); }
  #status .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status .muted { margin-left: auto; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; flex: none; }

  #fallback { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

  @media (max-width: 640px) {
    #legend { display: none; }
    #panel { top: auto; bottom: 150px; height: 45vh; }
    body.panel-open #answer { display: none; }
  }
</style>
</head>
<body>
<div id="graph"></div>
<div id="fallback"></div>

<div id="title"><h1>KNOWLEDGE GALAXY</h1><p id="stats"></p></div>
<div id="legend" class="glass"></div>

<aside id="panel" class="glass" aria-live="polite">
  <button id="close" aria-label="Close">×</button>
  <div class="group" id="p-group"></div>
  <h2 id="p-title"></h2>
  <div class="excerpt" id="p-excerpt"></div>
  <h3>CONNECTED</h3>
  <div class="chips" id="p-links"></div>
</aside>

<div id="ask">
  <div id="answer" class="glass"><div class="q"></div><div class="a"></div><div class="chips"></div></div>
  <div id="status" data-mode="idle" role="status" aria-live="polite"><span class="dot"></span><span class="label"></span><span class="muted" hidden>muted (?mute=1)</span></div>
  <form id="form" class="glass" autocomplete="off">
    <input id="q" placeholder="Ask your notes anything…" maxlength="2000" aria-label="Question">
    <button type="button" id="reset" title="Start a new conversation">New</button>
    <button type="button" id="mic" title="Talk (click again to stop listening)" aria-label="Microphone" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button type="submit" id="send">Ask</button>
  </form>
</div>

<script src="graph-data.js"></script>
<script src="voice.js"></script>
<script>
  // If the module below never starts (CDN unreachable, missing data), say why.
  setTimeout(() => {
    if (window.__galaxyStarted) return;
    const f = document.getElementById("fallback");
    f.style.display = "grid";
    f.textContent = typeof GRAPH === "undefined"
      ? "graph-data.js is missing. Run: python3 build.py"
      : "Couldn't load the 3D libraries from the CDN. Check your internet connection.";
  }, 10000);
</script>
<!-- 3d-force-graph uses window.THREE when present and needs three >= 0.179, which ships
     only as ES modules, so three is imported here and shared with the UMD bundle. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";
window.THREE = THREE;
await new Promise((resolve, reject) => {
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js";
  s.onload = resolve; s.onerror = reject;
  document.head.appendChild(s);
});

{
  const $ = id => document.getElementById(id);
  window.__galaxyStarted = true;

  // ── data ──────────────────────────────────────────────────────
  const nodes = GRAPH.nodes;
  const links = GRAPH.links.map(l => ({ ...l }));
  const neighbours = nodes.map(() => new Set());
  GRAPH.links.forEach(l => { neighbours[l.source].add(l.target); neighbours[l.target].add(l.source); });

  const PALETTE = ["#6ea8ff", "#ff7eb6", "#7ef0c4", "#ffc56e", "#b48cff", "#6ee7ff", "#ff8f6e", "#d4f06e", "#f2a6ff", "#9aa8ff"];
  const groups = [...new Set(nodes.map(n => n.group))].sort();
  const colour = Object.fromEntries(groups.map((g, i) => [g, PALETTE[i % PALETTE.length]]));
  const legend = $("legend");
  const legendRows = {};

  function renderLegend() {
    $("stats").textContent = `${nodes.length} notes indexed · ${links.length} connections · ${groups.length} groups`;
    groups.forEach(g => {
      if (!colour[g]) colour[g] = PALETTE[groups.indexOf(g) % PALETTE.length];
      let row = legendRows[g];
      if (!row) {
        row = legendRows[g] = document.createElement("div");
        row.innerHTML = `<i></i><b></b><span class="n"></span>`;
        row.querySelector("i").style.cssText = `background:${colour[g]};color:${colour[g]}`;
        row.querySelector("b").textContent = g;
        row.querySelector("b").style.fontWeight = "400";
        row.onclick = () => Focus.cluster(nodes.filter(n => n.group === g).map(n => n.id), { frame: true });
        legend.appendChild(row);
      }
      row.querySelector(".n").textContent = nodes.filter(n => n.group === g).length;
    });
  }
  renderLegend();

  // ── glowing node objects ──────────────────────────────────────
  const glowTexture = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.18, "rgba(255,255,255,0.55)");
    g.addColorStop(0.45, "rgba(255,255,255,0.12)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();
  const sphere = new THREE.SphereGeometry(1, 20, 14);

  function nodeObject(n) {
    const size = 2.2 + Math.sqrt(n.degree || 0) * 0.9;
    const group = new THREE.Group();
    const core = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ color: colour[n.group], transparent: true }));
    core.scale.setScalar(size);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture, color: colour[n.group], transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.setScalar(size * 7);
    group.add(glow, core);
    n.__core = core; n.__glow = glow;
    return group;
  }

  // ── graph ─────────────────────────────────────────────────────
  // What is lit and where the camera points. Read anywhere, written ONLY by Focus below.
  const view = { lit: null, centre: null };   // lit: Set of node ids or null (all lit)

  const lit = id => !view.lit || view.lit.has(id);
  // A centred note lights its own links; a lit cluster lights links inside the cluster.
  const linkLit = l => {
    if (!view.lit) return false;
    const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
    return view.centre != null ? (s === view.centre || t === view.centre) : view.lit.has(s) && view.lit.has(t);
  };

  const Graph = ForceGraph3D({ controlType: "orbit" })($("graph"))
    .backgroundColor("#000000")
    .showNavInfo(false)
    .graphData({ nodes, links })
    .nodeId("id")
    .nodeLabel(n => `<div style="font:13px system-ui;padding:4px 8px;background:rgba(5,8,16,.85);border:1px solid ${colour[n.group]};border-radius:8px">${escapeHtml(n.label)}</div>`)
    .nodeThreeObject(nodeObject)
    .linkColor(l => linkLit(l) ? "rgba(170,200,255,0.55)" : (view.lit ? "rgba(120,140,200,0.04)"
      : l.type === "mention" ? "rgba(140,170,255,0.35)" : "rgba(140,170,255,0.12)"))
    .linkWidth(l => linkLit(l) ? 0.4 : 0)
    .linkDirectionalParticles(l => linkLit(l) ? 3 : 0)
    .linkDirectionalParticleWidth(1.2)
    .linkDirectionalParticleColor(() => "#dfe9ff")
    .linkDirectionalParticleSpeed(0.006)
    .onNodeClick(n => Focus.note(n.id))
    .onBackgroundClick(() => Focus.clear())
    // Node dragging off: its drag-end code sends a synthetic pointerup that
    // OrbitControls (needed for autoRotate) chokes on.
    .enableNodeDrag(false)
    .d3VelocityDecay(0.3);

  Graph.d3Force("charge").strength(-140);
  Graph.d3Force("link").distance(l => l.type === "mention" ? 55 : 95);

  const controls = Graph.controls();   // camera moves only through Focus
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.enableDamping = true;

  // starfield
  (() => {
    const count = 4000, pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 1800 + Math.random() * 2600, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
      pos.set([r * Math.sin(p) * Math.cos(t), r * Math.sin(p) * Math.sin(t), r * Math.cos(p)], i * 3);
      const tint = 0.6 + Math.random() * 0.4, blue = Math.random() < 0.25 ? 1 : tint;
      col.set([tint, tint, blue], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const stars = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 2.2, vertexColors: true, transparent: true, opacity: 0.85, sizeAttenuation: false, depthWrite: false }));
    Graph.scene().add(stars);
    (function twinkle(t) { stars.rotation.y = t * 0.000004; requestAnimationFrame(twinkle); })(0);
  })();


  // ── focus: the ONE owner of the camera and the lit set ────────
  // Nothing else calls Graph.cameraPosition / zoomToFit, touches controls.autoRotate,
  // or writes `view`. Clicks, chips, the legend and voice commands all come through here.
  const CLUSTER_MIN = 4;   // an answer drawing on this many notes lights them, no flight

  const Focus = {
    /** Fly to one note, light it and its direct neighbours (plus `also`), open its panel. */
    note(id, { also = [] } = {}) {
      const n = nodes[id];
      if (!n) return;
      view.centre = id;
      view.lit = new Set([id, ...neighbours[id], ...also]);
      controls.autoRotate = false;
      paint();
      const dist = 240, r = Math.hypot(n.x, n.y, n.z) || 1, k = 1 + dist / r;
      Graph.cameraPosition({ x: n.x * k, y: n.y * k, z: n.z * k }, { x: n.x, y: n.y, z: n.z }, 1600);
      openPanel(n);
    },

    /** Light a set of notes. The camera stays put unless `frame` asks to fit them. */
    cluster(ids, { frame = false } = {}) {
      const set = new Set(ids.filter(i => nodes[i]));
      if (!set.size) return;
      view.centre = null;
      view.lit = set;
      closePanel();
      paint();
      if (frame) { controls.autoRotate = false; Graph.zoomToFit(1400, 90, n => set.has(n.id)); }
    },

    /** Everything lit again, back to the overview, idle rotation resumes. */
    clear() {
      view.centre = null; view.lit = null;
      closePanel();
      paint();
      Graph.cameraPosition(undefined, { x: 0, y: 0, z: 0 }, 1200);
      setTimeout(() => { if (!view.lit) controls.autoRotate = true; }, 1300);
    },

    overview() { Graph.zoomToFit(1200, 60); },

    /**
     * The answer path's decision. The server has already decided whether the question
     * was about the notes; only then does the number of sources pick the camera move.
     * Returns what it did: "note", "cluster" or "still".
     */
    fromAnswer({ about_notes, nodes: used = [] }) {
      used = used.filter(i => nodes[i]);
      if (!about_notes || !used.length) return "still";        // small talk / not covered
      if (used.length >= CLUSTER_MIN) { Focus.cluster(used); return "cluster"; }
      Focus.note(used[0], { also: used.slice(1) });              // used[0] = top source
      return "note";
    },

    get current() { return view.centre; },
  };

  const glowScale = n => (2.2 + Math.sqrt(n.degree || 0) * 0.9) * (n.id === view.centre ? 11 : 7);

  function paint() {
    nodes.forEach(n => {
      if (!n.__core) return;
      const on = lit(n.id), centre = n.id === view.centre;
      n.__core.material.opacity = on ? 1 : 0.12;
      n.__glow.material.opacity = on ? (centre ? 1.4 : 0.9) : 0.05;
      n.__glow.scale.setScalar(glowScale(n));
    });
    Graph.linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth())
      .linkDirectionalParticles(Graph.linkDirectionalParticles());
  }

  setTimeout(() => Focus.overview(), 2500);

  // ── new notes: the ONE viewer door ────────────────────────────
  // Every note born at runtime comes through addNote(): it is placed at its most related
  // node, linked exactly as the server linked it, pulses, and the camera flies to it.
  // Returns false if this tab's graph is out of step with the server (caller reloads).
  function addNote(node, newLinks = [], anchor = null) {
    if (node.id !== nodes.length) return false;
    if (!groups.includes(node.group)) groups.push(node.group);

    const a = nodes[anchor];
    // Beside the anchor, not on it: two nodes in the same spot repel violently.
    const t = Math.random() * Math.PI * 2, u = Math.acos(2 * Math.random() - 1), r = 14;
    const at = a ? { x: a.x + r * Math.sin(u) * Math.cos(t), y: a.y + r * Math.sin(u) * Math.sin(t), z: a.z + r * Math.cos(u) }
                 : { x: 0, y: 0, z: 0 };
    // Pinned at its birthplace (fx/fy/fz) through the pulse and the flight; otherwise the
    // repulsion from the neighbour it was born beside flings it away on the first tick.
    Object.assign(node, at, { fx: at.x, fy: at.y, fz: at.z });
    nodes.push(node);                       // nodes === GRAPH.nodes, so lookups by index work
    neighbours.push(new Set());
    for (const l of newLinks) {
      links.push({ ...l });
      GRAPH.links.push(l);
      neighbours[l.source].add(l.target);
      neighbours[l.target].add(l.source);
      const other = l.source === node.id ? l.target : l.source;
      nodes[other].degree = (nodes[other].degree || 0) + 1;
    }
    Graph.graphData({ nodes, links });
    renderLegend();
    pulse(node);
    setTimeout(() => Focus.note(node.id), 700);
    setTimeout(() => { node.fx = node.fy = node.fz = undefined; Graph.d3ReheatSimulation(); }, 700 + 1700);
    return true;
  }

  function pulse(n, ms = 1600) {
    const start = performance.now();
    (function frame(t) {
      if (!n.__glow) return requestAnimationFrame(frame);    // object not built yet
      const k = Math.min((t - start) / ms, 1);
      n.__glow.scale.setScalar(glowScale(n) * (1 + 1.8 * Math.sin(Math.PI * k)));
      n.__glow.material.opacity = 0.9 + 0.8 * Math.sin(Math.PI * k);
      if (k < 1) requestAnimationFrame(frame); else paint();
    })(start);
  }

  function chip(id) {
    const n = nodes[id], b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.innerHTML = "<i></i>";
    b.querySelector("i").style.background = colour[n.group];
    b.append(n.label);
    b.onclick = () => Focus.note(id);
    return b;
  }

  function openPanel(n) {
    $("p-group").textContent = n.group;
    $("p-group").style.color = colour[n.group];
    $("p-title").textContent = n.label;
    $("p-excerpt").textContent = n.excerpt;
    const box = $("p-links"); box.replaceChildren();
    [...neighbours[n.id]].sort((a, b) => nodes[a].label.localeCompare(nodes[b].label)).forEach(i => box.appendChild(chip(i)));
    if (!neighbours[n.id].size) box.textContent = "No links yet. Mention another note's title and it will join up.";
    $("panel").classList.add("open");
    document.body.classList.add("panel-open");
  }

  function closePanel() {
    $("panel").classList.remove("open");
    document.body.classList.remove("panel-open");
  }

  $("close").onclick = () => Focus.clear();
  addEventListener("keydown", e => {
    if (e.key === "Escape") { Voice.stopSpeaking(); Focus.clear(); }
    if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  });

  // ── chat ──────────────────────────────────────────────────────
  const answer = $("answer");
  // Runs a server action (the same tags the brain uses) and only speaks its receipt.
  async function runAction(tag, arg = "") {
    try {
      const res = await fetch("/action", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tag, arg }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    } catch (err) {
      return { answer: `That did not happen: ${err.message}`, nodes: [], action: { tag, ok: false } };
    }
  }

  async function newConversation() {
    const data = await runAction("RESET");
    if (data.action.ok) { answer.className = "glass"; Focus.clear(); }
    Voice.speak(data.answer);
  }
  $("reset").onclick = () => { newConversation(); $("q").focus(); };

  let lastFocus = "still";

  // The spoken answer stays short; the note itself is on screen, never read out.
  function spoken(text) {
    const sentences = text.replace(/\s+/g, " ").match(/[^.!?]+[.!?]*/g) || [text];
    return sentences.slice(0, 3).join(" ").trim();
  }

  // "remember that ..." -> a real note on disk, live in the galaxy. Never fails silently.
  const REMEMBER = /^\s*remember that\b/i;

  async function remember(text) {
    Voice.stopSpeaking();
    answer.className = "glass show thinking";
    answer.querySelector(".q").textContent = text;
    answer.querySelector(".a").textContent = "Writing it down";
    answer.querySelector(".chips").replaceChildren();
    let data;
    try {
      const res = await fetch("/remember", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      data = await res.json();
    } catch {
      data = { ok: false, answer: "I'm afraid that was not written down: the server didn't answer." };
    }
    if (!data.ok) {
      answer.className = "glass show error";
      answer.querySelector(".a").textContent = data.answer || data.error || "Not written down.";
      Voice.speak(data.answer || "I'm afraid that was not written down.");
      return;
    }
    answer.className = "glass show";
    answer.querySelector(".a").textContent = data.answer;
    if (!addNote(data.node, data.links, data.anchor)) {
      // Saved and indexed on the server, but this tab's galaxy is stale: redraw it.
      Voice.speak(data.answer + " The galaxy needs redrawing.").then(() => location.reload());
      return;
    }
    answer.querySelector(".chips").appendChild(chip(data.index));
    Voice.speak(data.answer);
  }

  // One path to the brain for typed and spoken questions. Every answer is spoken.
  async function ask(question) {
    question = question.trim();
    if (!question) return;
    if (REMEMBER.test(question)) return remember(question);
    Voice.stopSpeaking();
    $("send").disabled = true;
    Voice.setThinking(true);
    answer.className = "glass show thinking";
    answer.querySelector(".q").textContent = question;
    answer.querySelector(".a").textContent = "Searching your notes";
    answer.querySelector(".chips").replaceChildren();
    try {
      const res = await fetch("/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json().catch(() => ({ error: `Server returned ${res.status}` }));
      if (data.error) throw new Error(data.error);
      Voice.setThinking(false);
      answer.className = "glass show";
      answer.querySelector(".a").textContent = data.answer;
      const used = (data.nodes || []).filter(i => nodes[i]);
      if (data.about_notes) used.forEach(i => answer.querySelector(".chips").appendChild(chip(i)));
      // Decide the camera first, then talk: the panel is open while the answer is spoken.
      lastFocus = Focus.fromAnswer({ about_notes: !!data.about_notes, nodes: used });
      const said = Voice.speak(spoken(data.answer));
      // A server action that rebuilt the index: new graph data needs a fresh page.
      if (data.action && data.action.ok && data.action.reload) said.then(() => location.reload());
    } catch (err) {
      Voice.setThinking(false);
      answer.className = "glass show error";
      answer.querySelector(".a").textContent = err.message || "Couldn't reach the server.";
      Voice.speak("I couldn't get an answer. The reason is on screen.");
    } finally {
      $("send").disabled = false;
    }
  }

  $("form").onsubmit = e => {
    e.preventDefault();
    const question = $("q").value;
    $("q").value = "";
    ask(question);
  };

  // ── voice ─────────────────────────────────────────────────────
  // Commands that never reach the brain. Add more with Voice.addRoute(pattern, handler).
  Voice.addRoute(/^(?:new conversation|start over|start again|reset)$/, () => newConversation());
  Voice.addRoute(/^remember that\b/, (m, sentence) => remember(sentence));
  Voice.addRoute(/^(?:close|close (?:the )?panel|go back|zoom out|show (?:me )?everything)$/, () => Focus.clear());
  Voice.addRoute(/^(?:show me|open|go to|fly to) (?:the )?(.+)$/, (m, sentence) => {
    const want = m[1];
    const hit = nodes.find(n => n.label.toLowerCase() === want)
      || nodes.find(n => n.label.toLowerCase().includes(want))
      || nodes.find(n => want.includes(n.label.toLowerCase()));
    if (hit) { Focus.note(hit.id); Voice.speak(hit.label + "."); }
    else ask(sentence);
  });

  // The only way a note is read aloud: you ask for it.
  Voice.addRoute(/^(?:read|read out|read me) (?:it|that|this|the note|this note|that note|me the note)(?: (?:out|aloud|to me|please))*$/, () => {
    const id = Focus.current;
    if (id == null) Voice.speak("No note is open. Ask about one first.");
    else Voice.speak(`${nodes[id].label}. ${nodes[id].excerpt}`);
  });

  Voice.init({ ask });
  // Boot: one short spoken line from the persona; the real note count goes on screen.
  // The line is queued until the first click or key press (browsers block audio before that).
  fetch("/api/boot").then(r => r.json()).then(({ greeting }) => {
    Voice.setNote(`${greeting} ${nodes.length} notes indexed.`);
    Voice.speak(greeting);
  }).catch(() => Voice.setNote(`${nodes.length} notes indexed.`));

  window.galaxy = { Graph, Focus, view, addNote, get lastFocus() { return lastFocus; } };  // devtools + tests

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
}
</script>
</body>
</html>
